name: KFS France - publication isolee des cartes WebP

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Identifiant Actions du run France complet a publier
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: kfs-france-publication-releases
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer outil WebP
        run: python -m pip install 'Pillow>=10,<13'
      - name: Choisir le run France d'une generation demandee par la surveillance
        id: source
        env:
          TRIGGER: ${{ github.event_name }}
          SOURCE_WORKFLOW_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_MANUAL: ${{ github.event.inputs.source_run_id }}
        run: |
          ID="$SOURCE_MANUAL"
          if ! [[ "$ID" =~ ^[0-9]+$ ]]; then echo 'Identifiant run invalide' >&2; exit 1; fi
          echo "run_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Run France source : $ID"
      - name: Telecharger uniquement le run France valide
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          mkdir -p /tmp/kfs-france-source
          gh run download "$SOURCE_RUN" --dir /tmp/kfs-france-source
          find /tmp/kfs-france-source -name metadata.json -print
      - name: Publier les modeles complets sans modifier les cartes Europe
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m py_compile scripts/package_france_release.py
          published=0
          for model in ifs aifs-single gfs aigfs; do
            # gh run download inclut le nom de l'artefact (kfs-france-N).
            metadata_file="$(find /tmp/kfs-france-source -path "*/$model/metadata.json" -print -quit)"
            if [ -z "$metadata_file" ]; then
              echo "SKIP $model : metadata introuvable dans l'archive"
              continue
            fi
            model_dir="$(dirname "$metadata_file")"
            staging="/tmp/kfs-france-release/$model"
            horizon="$(jq -r '.requested_steps_h[-1]' "$metadata_file")"
            case "$horizon" in 12|72) ;; *) echo "SKIP $model : horizon incomplet ($horizon)"; continue ;; esac
            if ! python scripts/package_france_release.py --source "$model_dir" --output "$staging" --horizon "$horizon"; then
              echo "SKIP $model : modele incomplet, conserver la derniere publication valide"
              continue
            fi
            tag="france-$model"
            if [ "$horizon" = 12 ]; then tag="$tag-early"; fi
            # Jamais ecraser un run plus recent avec une archive plus ancienne.
            previous="/tmp/kfs-previous-$model-$horizon"
            mkdir -p "$previous"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release download "$tag" --pattern metadata.json --dir "$previous" --clobber || true
              if [ -f "$previous/metadata.json" ]; then
                old_cycle="$(jq -r '.run_utc // ""' "$previous/metadata.json")"
                new_cycle="$(jq -r '.run_utc // ""' "$staging/metadata.json")"
                if [ -n "$old_cycle" ] && [[ "$new_cycle" < "$old_cycle" ]]; then
                  echo "SKIP $model : run $new_cycle plus ancien que $old_cycle"
                  continue
                fi
              fi
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target main --latest=false \
                --title "KFS METEO France | $model" \
                --notes "Cartes France +3h/+6h a +72h, issues de donnees reelles. Release mise a jour sur les nouveaux runs. Europe non modifiee."
            fi
            echo "Publication France $model : $tag"
            gh release upload "$tag" "$staging"/*.webp "$staging/metadata.json" --clobber
            published=$((published+1))
          done
          echo "Modeles France publies : $published"
          if [ "$published" -eq 0 ]; then
            echo 'Aucun modele France complet : pas de changement des releases' >&2
            exit 0
          fi
