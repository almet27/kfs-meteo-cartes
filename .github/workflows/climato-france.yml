name: Climato France - mois en cours
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * *'
  push:
    paths:
      - scripts/build_climato_france.py
      - .github/workflows/climato-france.yml
permissions:
  contents: write
concurrency:
  group: climato-france-month
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install matplotlib requests
      - name: Cache climatological reference
        uses: actions/cache@v4
        with:
          path: .climato-cache
          key: climato-france-daily-v1-${{ github.run_id }}
          restore-keys: climato-france-daily-v1-
      - name: Build station maps
        run: python scripts/build_climato_france.py
      - name: Publish maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          backup="$(mktemp -d)"
          cp -a climato/france "$backup/france"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p climato/france
            cp -a "$backup/france/." climato/france/
            git add climato/france
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualiser bilan climatique du mois en France"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
