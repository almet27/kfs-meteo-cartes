name: KFS - diagnostics et cartes synchronises pour /tendance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_tendance_cards.py'
      - 'scripts/generate_tendance_risks.py'
      - 'scripts/kfs_synoptic_overlays.py'
      - 'scripts/generate_tendance_analysis.py'
      - '.github/workflows/tendance-analyse.yml'
  schedule:
    # Paris 08:30 toute l'annee : 06:30 UTC en ete, 07:30 UTC en hiver.
    # GitHub utilise UTC; le filtre ci-dessous exclut le doublon hors saison.
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'
    # Secours : 08:43 Paris. Les schedules GitHub peuvent être retardés ou omis.
    - cron: '43 6 * * *'
    - cron: '43 7 * * *'
    # Paris 21:00 du lundi au samedi : 19:00 UTC en ete, 20:00 UTC en hiver.
    - cron: '0 19 * * 1-6'
    - cron: '0 20 * * 1-6'
    # Secours : 21:13 Paris.
    - cron: '13 19 * * 1-6'
    - cron: '13 20 * * 1-6'
    # Dimanche : generation speciale avant le bulletin hebdomadaire (conservee).
    - cron: '07 16 * * 0'
permissions:
  contents: write
concurrency:
  group: kfs-tendance-analyse
  cancel-in-progress: false
jobs:
  verifier-horaire:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.filtre.outputs.lancer }}
    steps:
      - name: Selectionner l'heure de Paris (ete / hiver)
        id: filtre
        shell: bash
        env:
          KFS_EVENT: ${{ github.event_name }}
          KFS_CRON: ${{ github.event.schedule }}
        run: |
          lancer=false
          if [[ "$KFS_EVENT" != "schedule" ]]; then
            lancer=true
          elif [[ "$KFS_CRON" == "07 16 * * 0" ]]; then
            lancer=true
          else
            offset="$(TZ=Europe/Paris date +%z)"
            if [[ "$offset" == "+0200" && ( "$KFS_CRON" == "30 6 * * *" || "$KFS_CRON" == "43 6 * * *" || "$KFS_CRON" == "0 19 * * 1-6" || "$KFS_CRON" == "13 19 * * 1-6" ) ]]; then
              lancer=true
            elif [[ "$offset" == "+0100" && ( "$KFS_CRON" == "30 7 * * *" || "$KFS_CRON" == "43 7 * * *" || "$KFS_CRON" == "0 20 * * 1-6" || "$KFS_CRON" == "13 20 * * 1-6" ) ]]; then
              lancer=true
            fi
          fi
          echo "lancer=$lancer" >> "$GITHUB_OUTPUT"
          echo "Filtre /tendance: evenement=$KFS_EVENT cron=$KFS_CRON lancer=$lancer"
  analyse-et-cartes:
    needs: verifier-horaire
    if: needs.verifier-horaire.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les decodeurs ECMWF et le moteur graphique
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          pip install ecmwf-opendata cfgrib eccodes xarray numpy matplotlib cartopy 'Pillow>=10,<13'
      - name: Extraire les diagnostics aux memes cycles que les cartes Europe
        run: python scripts/generate_tendance_analysis.py
      # Inclut les masses d'air à 850 hPa et les fronts thermiques potentiels J+3/J+7.
      - name: Calculer les signaux géoréférencés de vent pluie neige
        run: python scripts/generate_tendance_risks.py
      - name: Generer les quatre cartes avec les diagnostics de la MEME acquisition
        run: python scripts/generate_tendance_cards.py
      - name: Archiver le bulletin technique et les quatre cartes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfs-tendance-analyse-cartes
          path: |
            forecast-maps/tendance/tendance-analyse-donnees.json
            forecast-maps/tendance/tendance-analyse-apercu.md
            forecast-maps/tendance/tendance-cartes.json
            forecast-maps/tendance/tendance-risques.json
            forecast-maps/tendance/tendance-risques-fond-*.png
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-carte-j15.png
          if-no-files-found: warn
      - name: Publier les donnees et cartes ensemble, jamais separement
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Conserver les fichiers calcules hors du checkout avant toute synchronisation.
          # Cela evite un rebase conflictuel si d'autres workflows publient entre-temps.
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          files=(
            forecast-maps/tendance/tendance-analyse-donnees.json
            forecast-maps/tendance/tendance-analyse-apercu.md
            forecast-maps/tendance/tendance-risques.json
            forecast-maps/tendance/tendance-cartes.json
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-carte-j15.png
          )
          for fond in forecast-maps/tendance/tendance-risques-fond-*.png; do
            if [[ -f "$fond" ]]; then files+=("$fond"); fi
          done
          for path in "${files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Fichier genere absent: $path"
              exit 1
            fi
            mkdir -p "$snapshot/$(dirname "$path")"
            cp "$path" "$snapshot/$path"
          done

          # Chaque tentative recommence depuis le dernier main, puis recopie le
          # lot de cartes et diagnostics synchronises. Aucun git pull --rebase.
          for attempt in 1 2 3 4 5; do
            echo "Publication /tendance: tentative $attempt/5"
            git fetch --no-tags origin main
            git reset --hard origin/main

            # Un run plus ancien ne doit pas remplacer une generation plus recente.
            if [[ -f forecast-maps/tendance/tendance-cartes.json ]] && \
              python -c 'import json,sys; from datetime import datetime; t=lambda p:datetime.fromisoformat(json.load(open(p))["generated_utc"]); sys.exit(0 if t(sys.argv[2]) > t(sys.argv[1]) else 1)' \
              "$snapshot/forecast-maps/tendance/tendance-cartes.json" "forecast-maps/tendance/tendance-cartes.json"; then
              echo "Une generation plus recente est deja en ligne; aucune publication."
              exit 0
            fi

            for path in "${files[@]}"; do
              cp "$snapshot/$path" "$path"
            done
            git add -- "${files[@]}"
            if git diff --cached --quiet; then
              echo "Les fichiers sont deja a jour."
              exit 0
            fi
            git commit -m 'Publier diagnostics et cartes IFS AIFS synchronises'
            if git push origin HEAD:main; then
              echo "Publication /tendance reussie."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Publication impossible apres 5 tentatives."
          exit 1
