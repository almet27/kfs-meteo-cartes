name: KFS - diagnostics et cartes synchronises pour /tendance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_tendance_cards.py'
      - 'scripts/generate_tendance_risks.py'
      - 'scripts/kfs_synoptic_overlays.py'
      - 'scripts/generate_tendance_analysis.py'
      - '.github/workflows/tendance-analyse.yml'
  schedule:
    # Générer AVANT le rendez-vous Discord de 08:30 Paris :
    # préparation principale à 08:12 Paris, puis secours à 08:30 et 08:43.
    # GitHub cron est en UTC; le filtre ne retient que la saison courante.
    - cron: '12 6 * * *' # 08:12 CEST
    - cron: '12 7 * * *' # 08:12 CET
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'
    # Secours : 08:43 Paris. Les schedules GitHub peuvent être retardés ou omis.
    - cron: '43 6 * * *'
    - cron: '43 7 * * *'
    # Paris 20:42 (prepare les cartes AVANT la publication de 21 h).
    # 18:42 UTC ete / 19:42 UTC hiver, apres la mise a jour IFS/AIFS 12Z.
    - cron: '42 18 * * 1-6'
    - cron: '42 19 * * 1-6'
    # Secours a 21:00, 21:13 et 21:43 heure de Paris si cartes non fraiches.
    - cron: '0 19 * * 1-6'
    - cron: '0 20 * * 1-6'
    - cron: '13 19 * * 1-6'
    - cron: '13 20 * * 1-6'
    - cron: '43 19 * * 1-6'
    - cron: '43 20 * * 1-6'
    # Dimanche : generation speciale avant le bulletin hebdomadaire (conservee).
    - cron: '07 16 * * 0'
permissions:
  contents: write
concurrency:
  group: kfs-tendance-analyse
  cancel-in-progress: false
jobs:
  verifier-horaire:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.filtre.outputs.lancer }}
    steps:
      - name: Selectionner l'heure de Paris (ete / hiver)
        id: filtre
        shell: bash
        env:
          KFS_EVENT: ${{ github.event_name }}
          KFS_CRON: ${{ github.event.schedule }}
        run: |
          lancer=false
          if [[ "$KFS_EVENT" != "schedule" ]]; then
            lancer=true
          elif [[ "$KFS_CRON" == "07 16 * * 0" ]]; then
            lancer=true
          else
            offset="$(TZ=Europe/Paris date +%z)"
            if [[ "$offset" == "+0200" && ( "$KFS_CRON" == "12 6 * * *" || "$KFS_CRON" == "30 6 * * *" || "$KFS_CRON" == "43 6 * * *" || "$KFS_CRON" == "42 18 * * 1-6" || "$KFS_CRON" == "0 19 * * 1-6" || "$KFS_CRON" == "13 19 * * 1-6" || "$KFS_CRON" == "43 19 * * 1-6" ) ]]; then
              lancer=true
            elif [[ "$offset" == "+0100" && ( "$KFS_CRON" == "12 7 * * *" || "$KFS_CRON" == "30 7 * * *" || "$KFS_CRON" == "43 7 * * *" || "$KFS_CRON" == "42 19 * * 1-6" || "$KFS_CRON" == "0 20 * * 1-6" || "$KFS_CRON" == "13 20 * * 1-6" || "$KFS_CRON" == "43 20 * * 1-6" ) ]]; then
              lancer=true
            fi
          fi
          # Les passages de 08:30 et 08:43 ne recalculent pas un manifeste
          # déjà généré et vérifié après 07:55 heure de Paris.
          if [[ "$lancer" == true && "$KFS_EVENT" == schedule && \
                ( "$KFS_CRON" == "30 6 * * *" || "$KFS_CRON" == "30 7 * * *" || \
                  "$KFS_CRON" == "43 6 * * *" || "$KFS_CRON" == "43 7 * * *" || \
                  "$KFS_CRON" == "0 19 * * 1-6" || "$KFS_CRON" == "0 20 * * 1-6" || \
                  "$KFS_CRON" == "13 19 * * 1-6" || "$KFS_CRON" == "13 20 * * 1-6" || \
                  "$KFS_CRON" == "43 19 * * 1-6" || "$KFS_CRON" == "43 20 * * 1-6" ) ]]; then
            url="https://raw.githubusercontent.com/almet27/kfs-meteo-cartes/main/forecast-maps/tendance/tendance-cartes.json?check=$(date +%s)"
            if curl -fsSL --max-time 15 "$url" -o /tmp/kfs-tendance-latest.json; then
              if python - "$KFS_CRON" <<'PY'
          import json,sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          cron=sys.argv[1]
          evening=cron in {"0 19 * * 1-6","0 20 * * 1-6",
                           "13 19 * * 1-6","13 20 * * 1-6",
                           "43 19 * * 1-6","43 20 * * 1-6"}
          now=datetime.now(ZoneInfo("Europe/Paris"))
          try:
              with open("/tmp/kfs-tendance-latest.json") as f:
                  data=json.load(f)
              created=datetime.fromisoformat(data["generated_utc"]).astimezone(ZoneInfo("Europe/Paris"))
              gate=now.replace(hour=20 if evening else 7,minute=30 if evening else 55,second=0,microsecond=0)
              if (data.get("schema_version")==1 and data.get("status")=="illustrative_model_maps"
                  and len(data.get("period_maps",[]))==4
                  and {x.get("id") for x in data["period_maps"]}=={"j3","j7","j10","j15"}
                  and created.date()==now.date() and created>=gate):
                  print("Créneau /tendance déjà généré : "+created.isoformat())
                  sys.exit(0)
          except Exception as e:
              print("Contrôle de secours non concluant : "+str(e)[:160])
          sys.exit(1)
          PY
              then
                lancer=false
                echo "Secours /tendance ignoré : génération déjà actualisée pour le créneau."
              fi
            fi
          fi
          echo "lancer=$lancer" >> "$GITHUB_OUTPUT"
          echo "Filtre /tendance: evenement=$KFS_EVENT cron=$KFS_CRON lancer=$lancer"
  analyse-et-cartes:
    needs: verifier-horaire
    if: needs.verifier-horaire.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les decodeurs ECMWF et le moteur graphique
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          pip install ecmwf-opendata cfgrib eccodes xarray numpy matplotlib cartopy 'Pillow>=10,<13'
      - name: Extraire les diagnostics aux memes cycles que les cartes Europe
        run: python scripts/generate_tendance_analysis.py
      # Inclut les masses d'air à 850 hPa et les fronts thermiques potentiels J+3/J+7.
      - name: Calculer les signaux géoréférencés de vent pluie neige
        run: python scripts/generate_tendance_risks.py
      - name: Generer les quatre cartes avec les diagnostics de la MEME acquisition
        run: python scripts/generate_tendance_cards.py
      - name: Archiver le bulletin technique et les quatre cartes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfs-tendance-analyse-cartes
          path: |
            forecast-maps/tendance/tendance-analyse-donnees.json
            forecast-maps/tendance/tendance-analyse-apercu.md
            forecast-maps/tendance/tendance-cartes.json
            forecast-maps/tendance/tendance-risques.json
            forecast-maps/tendance/tendance-risques-fond-*.png
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-carte-j15.png
          if-no-files-found: warn
      - name: Publier les donnees et cartes ensemble, jamais separement
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Conserver les fichiers calcules hors du checkout avant toute synchronisation.
          # Cela evite un rebase conflictuel si d'autres workflows publient entre-temps.
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          files=(
            forecast-maps/tendance/tendance-analyse-donnees.json
            forecast-maps/tendance/tendance-analyse-apercu.md
            forecast-maps/tendance/tendance-risques.json
            forecast-maps/tendance/tendance-cartes.json
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-carte-j15.png
          )
          for fond in forecast-maps/tendance/tendance-risques-fond-*.png; do
            if [[ -f "$fond" ]]; then files+=("$fond"); fi
          done
          for path in "${files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Fichier genere absent: $path"
              exit 1
            fi
            mkdir -p "$snapshot/$(dirname "$path")"
            cp "$path" "$snapshot/$path"
          done

          # Chaque tentative recommence depuis le dernier main, puis recopie le
          # lot de cartes et diagnostics synchronises. Aucun git pull --rebase.
          for attempt in 1 2 3 4 5; do
            echo "Publication /tendance: tentative $attempt/5"
            git fetch --no-tags origin main
            git reset --hard origin/main

            # Un run plus ancien ne doit pas remplacer une generation plus recente.
            if [[ -f forecast-maps/tendance/tendance-cartes.json ]] && \
              python -c 'import json,sys; from datetime import datetime; t=lambda p:datetime.fromisoformat(json.load(open(p))["generated_utc"]); sys.exit(0 if t(sys.argv[2]) > t(sys.argv[1]) else 1)' \
              "$snapshot/forecast-maps/tendance/tendance-cartes.json" "forecast-maps/tendance/tendance-cartes.json"; then
              echo "Une generation plus recente est deja en ligne; aucune publication."
              exit 0
            fi

            for path in "${files[@]}"; do
              cp "$snapshot/$path" "$path"
            done
            git add -- "${files[@]}"
            if git diff --cached --quiet; then
              echo "Les fichiers sont deja a jour."
              exit 0
            fi
            git commit -m 'Publier diagnostics et cartes IFS AIFS synchronises'
            if git push origin HEAD:main; then
              echo "Publication /tendance reussie."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Publication impossible apres 5 tentatives."
          exit 1
