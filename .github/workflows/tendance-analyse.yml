name: KFS - diagnostics et cartes synchronises pour /tendance
on:
  workflow_dispatch:
  # Recalculer dès qu’un atlas Europe IFS/AIFS plus récent est publié.
  workflow_run:
    workflows: ["Cartes prévisions Europe IFS AIFS"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/generate_tendance_cards.py'
      - 'scripts/generate_tendance_risks.py'
      - 'scripts/kfs_synoptic_overlays.py'
      - 'scripts/generate_tendance_analysis.py'
      - '.github/workflows/tendance-analyse.yml'
  schedule:
    # Génération principale à 08:45 heure de Paris (été comme hiver).
    # Secours à 09:15 puis 09:30 en cas d'échec ou de carte encore périmée.
    # GitHub cron est en UTC; le filtre ne retient que la saison courante.
    - cron: '5,35 * * * *' # surveillance des nouveaux cycles, sans recalcul si synchronisé
    - cron: '45 6 * * *' # 08:45 CEST
    - cron: '45 7 * * *' # 08:45 CET
    - cron: '15 7 * * *' # 09:15 CEST
    - cron: '15 8 * * *' # 09:15 CET
    - cron: '30 7 * * *' # 09:30 CEST
    - cron: '30 8 * * *' # 09:30 CET
    # Paris 20:42 (prepare les cartes AVANT la publication de 21 h).
    # 18:42 UTC ete / 19:42 UTC hiver, apres la mise a jour IFS/AIFS 12Z.
    - cron: '42 18 * * 1-6'
    - cron: '42 19 * * 1-6'
    # Secours a 21:00, 21:13 et 21:43 heure de Paris si cartes non fraiches.
    - cron: '0 19 * * 1-6'
    - cron: '0 20 * * 1-6'
    - cron: '13 19 * * 1-6'
    - cron: '13 20 * * 1-6'
    - cron: '43 19 * * 1-6'
    - cron: '43 20 * * 1-6'
    # Dimanche : generation speciale avant le bulletin hebdomadaire (conservee).
    - cron: '07 16 * * 0'
permissions:
  contents: write
concurrency:
  group: kfs-tendance-analyse
  cancel-in-progress: false
jobs:
  verifier-horaire:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.filtre.outputs.lancer }}
    steps:
      - name: Selectionner l'heure de Paris (ete / hiver)
        id: filtre
        shell: bash
        env:
          KFS_EVENT: ${{ github.event_name }}
          KFS_CRON: ${{ github.event.schedule }}
        run: |
          lancer=false
          if [[ "$KFS_EVENT" != "schedule" ]]; then
            lancer=true
          elif [[ "$KFS_CRON" == "5,35 * * * *" || "$KFS_CRON" == "07 16 * * 0" ]]; then
            lancer=true
          else
            offset="$(TZ=Europe/Paris date +%z)"
            if [[ "$offset" == "+0200" && ( "$KFS_CRON" == "45 6 * * *" || "$KFS_CRON" == "15 7 * * *" || "$KFS_CRON" == "30 7 * * *" || "$KFS_CRON" == "42 18 * * 1-6" || "$KFS_CRON" == "0 19 * * 1-6" || "$KFS_CRON" == "13 19 * * 1-6" || "$KFS_CRON" == "43 19 * * 1-6" ) ]]; then
              lancer=true
            elif [[ "$offset" == "+0100" && ( "$KFS_CRON" == "45 7 * * *" || "$KFS_CRON" == "15 8 * * *" || "$KFS_CRON" == "30 8 * * *" || "$KFS_CRON" == "42 19 * * 1-6" || "$KFS_CRON" == "0 20 * * 1-6" || "$KFS_CRON" == "13 20 * * 1-6" || "$KFS_CRON" == "43 20 * * 1-6" ) ]]; then
              lancer=true
            fi
          fi
          # Ne pas devancer 08:45 sur un workflow_run nocturne/matinal.
          # Le créneau de 08:45 est conservé comme génération principale.
          if [[ "$lancer" == true && "$KFS_EVENT" == workflow_run ]]; then
            paris_hm="$(TZ=Europe/Paris date +%H%M)"
            if (( 10#$paris_hm >= 800 && 10#$paris_hm < 845 )); then
              lancer=false
              echo "Atlas reçu avant 08:45 : la génération attend le créneau du matin."
            fi
          fi
          # Surveillance indépendante : recalcul seulement si le catalogue ECMWF a un cycle plus récent.
          if [[ "$lancer" == true && "$KFS_CRON" == "5,35 * * * *" ]]; then
            paris_hm="$(TZ=Europe/Paris date +%H%M)"
            if (( 10#$paris_hm >= 800 && 10#$paris_hm < 845 )); then
              lancer=false
            fi
            if [[ "$lancer" == true ]]; then
              base="https://raw.githubusercontent.com/almet27/kfs-meteo-cartes/main/forecast-maps"
              if curl -fsSL --max-time 15 "$base/tendance/tendance-cartes.json?check=$(date +%s)" -o /tmp/kfs-watch-trend.json && curl -fsSL --max-time 15 "$base/europe/metadata.json?check=$(date +%s)" -o /tmp/kfs-watch-atlas.json; then
                if python - <<'PY'
          import json,sys
          from datetime import datetime,timezone,timedelta
          t=json.load(open("/tmp/kfs-watch-trend.json")); a=json.load(open("/tmp/kfs-watch-atlas.json"))
          dt=lambda s:datetime.fromisoformat(s.replace("Z","+00:00"))
          try:
              maps={x["id"]:x for x in t["period_maps"]}
              same=all(dt(maps[j]["run_utc"][key])==dt(a["runs_utc"][model][h]) for j,h in (("j3","72"),("j7","168"),("j10","240"),("j15","360")) for key,model in (("ifs","ifs"),("aifs","aifs-single")))
              fresh=datetime.now(timezone.utc)-dt(t["generated_utc"])<timedelta(hours=18)
              ready=all(maps[j].get("synoptic_consensus",{}).get("method")=="weighted_blend" and set(maps[j]["synoptic_consensus"].get("models",[]))=={"ifs","aifs-single","gfs"} for j in ("j3","j7","j10","j15"))
              sys.exit(0 if same and fresh and ready else 1)
          except (KeyError,ValueError,TypeError):
              sys.exit(1)
          PY
                then lancer=false; echo "Surveillance : cycles déjà synchronisés."; fi
              else
                lancer=false; echo "Surveillance : catalogue inaccessible, prochain contrôle programmé."
              fi
            fi
          fi
          # Les secours ne recalculent pas un manifeste synchronisé aux cycles
          # du catalogue Europe et généré après 08:40 (20:30 le soir).
          if [[ "$lancer" == true && ( "$KFS_EVENT" == workflow_run || "$KFS_EVENT" == schedule ) && \
                ( "$KFS_EVENT" == workflow_run || "$KFS_CRON" == "15 7 * * *" || "$KFS_CRON" == "15 8 * * *" || \
                  "$KFS_CRON" == "30 7 * * *" || "$KFS_CRON" == "30 8 * * *" || \
                  "$KFS_CRON" == "0 19 * * 1-6" || "$KFS_CRON" == "0 20 * * 1-6" || \
                  "$KFS_CRON" == "13 19 * * 1-6" || "$KFS_CRON" == "13 20 * * 1-6" || \
                  "$KFS_CRON" == "43 19 * * 1-6" || "$KFS_CRON" == "43 20 * * 1-6" ) ]]; then
            url="https://raw.githubusercontent.com/almet27/kfs-meteo-cartes/main/forecast-maps/tendance/tendance-cartes.json?check=$(date +%s)"
            atlas_url="https://raw.githubusercontent.com/almet27/kfs-meteo-cartes/main/forecast-maps/europe/metadata.json?check=$(date +%s)"
            if curl -fsSL --max-time 15 "$url" -o /tmp/kfs-tendance-latest.json && \
               curl -fsSL --max-time 15 "$atlas_url" -o /tmp/kfs-europe-current.json; then
              if python - "$KFS_CRON" <<'PY'
          import json,sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          cron=sys.argv[1]
          evening=cron in {"0 19 * * 1-6","0 20 * * 1-6",
                           "13 19 * * 1-6","13 20 * * 1-6",
                           "43 19 * * 1-6","43 20 * * 1-6"}
          now=datetime.now(ZoneInfo("Europe/Paris"))
          try:
              with open("/tmp/kfs-tendance-latest.json") as f:
                  data=json.load(f)
              with open("/tmp/kfs-europe-current.json") as f:
                  atlas=json.load(f)
              created=datetime.fromisoformat(data["generated_utc"]).astimezone(ZoneInfo("Europe/Paris"))
              gate=now.replace(hour=20 if evening else 8,minute=30 if evening else 40,second=0,microsecond=0)
              if (data.get("schema_version")==1 and data.get("status")=="illustrative_model_maps"
                  and len(data.get("period_maps",[]))==4
                  and {x.get("id") for x in data["period_maps"]}=={"j3","j7","j10","j15"}
                  and all(x.get("synoptic_consensus",{}).get("method")=="weighted_blend" for x in data["period_maps"])
                  and created.date()==now.date() and created>=gate
                  and data.get("charts_generated_utc")==atlas.get("generated_utc")
                  and all(datetime.fromisoformat(data["period_maps"][i]["run_utc"]["ifs"].replace("Z","+00:00"))==datetime.fromisoformat(atlas["runs_utc"]["ifs"][h].replace("Z","+00:00"))
                      for i,h in enumerate(("72","168","240","360")))):
                  print("Créneau /tendance déjà généré : "+created.isoformat())
                  sys.exit(0)
          except Exception as e:
              print("Contrôle de secours non concluant : "+str(e)[:160])
          sys.exit(1)
          PY
              then
                lancer=false
                echo "Secours /tendance ignoré : génération déjà actualisée pour le créneau."
              fi
            fi
          fi
          echo "lancer=$lancer" >> "$GITHUB_OUTPUT"
          echo "Filtre /tendance: evenement=$KFS_EVENT cron=$KFS_CRON lancer=$lancer"
  analyse-et-cartes:
    needs: verifier-horaire
    if: needs.verifier-horaire.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les decodeurs ECMWF et le moteur graphique
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev fonts-noto-color-emoji
          pip install ecmwf-opendata cfgrib eccodes xarray numpy scipy matplotlib cartopy herbie-data 'Pillow>=10,<13'
      - name: Extraire les diagnostics aux memes cycles que les cartes Europe
        run: python scripts/generate_tendance_analysis.py
      # Inclut les masses d'air à 850 hPa et les fronts thermiques potentiels J+3/J+7.
      - name: Calculer les signaux géoréférencés de vent pluie neige
        run: python scripts/generate_tendance_risks.py
      - name: Generer les quatre cartes avec les diagnostics de la MEME acquisition
        run: python scripts/generate_tendance_cards.py
      - name: Archiver le bulletin technique et les quatre cartes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfs-tendance-analyse-cartes
          path: |
            forecast-maps/tendance/tendance-analyse-donnees.json
            forecast-maps/tendance/tendance-analyse-apercu.md
            forecast-maps/tendance/tendance-cartes.json
            forecast-maps/tendance/tendance-risques.json
            forecast-maps/tendance/tendance-risques-fond-*.png
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-carte-j15.png
            forecast-maps/tendance/tendance-carte-france-*.png
          if-no-files-found: warn
      - name: Publier les donnees et cartes ensemble, jamais separement
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Never replace the public KFS atlas with a single-model fallback.
          python - <<'PY'
          import json, math
          d=json.load(open("forecast-maps/tendance/tendance-cartes.json"))
          for zone in ("period_maps","france_maps"):
              cards=d[zone]
              assert {c["id"] for c in cards}=={"j3","j7","j10","j15"}
              for c in cards:
                  blend=c.get("synoptic_consensus",{})
                  w=blend.get("weights",{})
                  if blend.get("method")!="weighted_blend" or set(w)!={"ifs","aifs-single","gfs"} or not all(math.isfinite(v) and v>0 for v in w.values()) or abs(sum(w.values())-1)>1e-6:
                      raise SystemExit("KFS : grilles insuffisantes "+zone+" "+c["id"]+" "+str(blend.get("excluded",{})))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Conserver les fichiers calcules hors du checkout avant toute synchronisation.
          # Cela evite un rebase conflictuel si d'autres workflows publient entre-temps.
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          files=(
            forecast-maps/tendance/tendance-analyse-donnees.json
            forecast-maps/tendance/tendance-analyse-apercu.md
            forecast-maps/tendance/tendance-risques.json
            forecast-maps/tendance/tendance-cartes.json
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-carte-j15.png
            forecast-maps/tendance/tendance-carte-france-j3.png
            forecast-maps/tendance/tendance-carte-france-j7.png
            forecast-maps/tendance/tendance-carte-france-j10.png
            forecast-maps/tendance/tendance-carte-france-j15.png
          )
          for fond in forecast-maps/tendance/tendance-risques-fond-*.png; do
            if [[ -f "$fond" ]]; then files+=("$fond"); fi
          done
          for path in "${files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Fichier genere absent: $path"
              exit 1
            fi
            mkdir -p "$snapshot/$(dirname "$path")"
            cp "$path" "$snapshot/$path"
          done

          # Chaque tentative recommence depuis le dernier main, puis recopie le
          # lot de cartes et diagnostics synchronises. Aucun git pull --rebase.
          for attempt in 1 2 3 4 5; do
            echo "Publication /tendance: tentative $attempt/5"
            git fetch --no-tags origin main
            git reset --hard origin/main

            # Un run plus ancien ne doit pas remplacer une generation plus recente.
            if [[ -f forecast-maps/tendance/tendance-cartes.json ]] && \
              python -c 'import json,sys; from datetime import datetime; t=lambda p:datetime.fromisoformat(json.load(open(p))["generated_utc"]); sys.exit(0 if t(sys.argv[2]) > t(sys.argv[1]) else 1)' \
              "$snapshot/forecast-maps/tendance/tendance-cartes.json" "forecast-maps/tendance/tendance-cartes.json"; then
              echo "Une generation plus recente est deja en ligne; aucune publication."
              exit 0
            fi

            for path in "${files[@]}"; do
              cp "$snapshot/$path" "$path"
            done
            git add -- "${files[@]}"
            if git diff --cached --quiet; then
              echo "Les fichiers sont deja a jour."
              exit 0
            fi
            git commit -m 'Publier diagnostics et cartes IFS AIFS synchronises'
            if git push origin HEAD:main; then
              echo "Publication /tendance reussie."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Publication impossible apres 5 tentatives."
          exit 1
