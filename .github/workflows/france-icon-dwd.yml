name: KFS France - ICON-EU quotidien direct DWD
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_icon_dwd_daily.py
      - .github/workflows/france-icon-dwd.yml
  schedule:
    - cron: '12,27,42,57 * * * *'
permissions:
  contents: write
concurrency:
  group: kfs-france-icon-native
  cancel-in-progress: false
jobs:
  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchroniser le catalogue régional
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Installer les outils GRIB et cartographiques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.8' 'cartopy>=0.23' eccodes
      - name: Vérifier la syntaxe
        run: python -m py_compile scripts/generate_icon_dwd_daily.py scripts/france_daily.py scripts/kfs_surface_style.py
      - name: Produire les quatre cartes quotidiennes du modèle ICON-EU
        env:
          KFS_FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python scripts/generate_icon_dwd_daily.py
      - name: Publier uniquement ICON-EU et le catalogue préservé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep only this model's generated products; merge into the current
          # catalog on each push attempt, never overwrite concurrent ARÔME.
          export STAGED_ICON="$(mktemp -d)"
          cp forecast-maps/france/shortterm-daily/latest.json "$STAGED_ICON/"
          cp forecast-maps/france/shortterm-daily/daily-icon_eu-*.png "$STAGED_ICON/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          src=Path(os.environ["STAGED_ICON"])
          dest=Path("forecast-maps/france/shortterm-daily")
          new=json.loads((src/"latest.json").read_text())
          current=json.loads((dest/"latest.json").read_text())
          model=new["models"]["icon_eu"]
          prev=current.get("models",{}).get("icon_eu",{})
          if prev.get("generated_utc","")<=model.get("generated_utc",""):
              current.setdefault("models",{})["icon_eu"]=model
              current["generated_utc"]=max(current.get("generated_utc",""),new.get("generated_utc",""))
              for day in model["days"].values():
                  for entry in day["maps"].values():
                      name=entry["filename"]
                      shutil.copy2(src/name,dest/name)
              (dest/"latest.json").write_text(json.dumps(current,ensure_ascii=False,indent=2)+"\n")
          PY
            git add forecast-maps/france/shortterm-daily/latest.json forecast-maps/france/shortterm-daily/daily-icon_eu-*.png
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Actualiser ICON-EU natif DWD sans écraser ARÔME'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
