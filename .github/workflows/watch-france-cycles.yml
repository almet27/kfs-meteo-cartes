name: KFS France et Europe - surveillance des nouveaux runs (5 minutes)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_france_cycles.py'
      - 'scripts/check_europe_cycles.py'
      - '.github/workflows/watch-france-cycles.yml'
  workflow_run:
    workflows:
      - 'Publier radar RainViewer pour Discord'
    types: [completed]
  schedule:
    - cron: '2-59/5 * * * *' # secours : contrôle toutes les 5 minutes

permissions:
  contents: write
  actions: write

concurrency:
  group: kfs-france-source-monitor
  cancel-in-progress: false

jobs:
  verifier:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchroniser avec l'etat le plus recent du depot
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Relancer /tendance dès que le cycle IFS complet est disponible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Ne pas confondre un manifeste récent avec les quatre échéances du cycle attendu.
          # L'atlas Europe est surveillé séparément; aucune acquisition lourde tant qu'il est incomplet.
          if ! python - <<'PY'
          import json, math, sys
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path
          now = datetime.now(ZoneInfo("Europe/Paris"))
          minute = now.hour * 60 + now.minute
          if 120 <= minute < 360:
              sys.exit(1)
          evening = minute >= 20 * 60 + 30 or minute < 120
          day = (now - timedelta(days=1)).date() if minute < 120 else now.date()
          expected = datetime(day.year, day.month, day.day, 12 if evening else 0, tzinfo=timezone.utc)
          pairs = {"j3":72, "j7":168, "j10":240, "j15":360}
          def parse(s):
              return datetime.fromisoformat(s.replace("Z","+00:00")).astimezone(timezone.utc)
          def read(path):
              return json.loads(Path(path).read_text())
          def ready(d):
              generated = parse(d["generated_utc"])
              if generated > now + timedelta(minutes=10) or now - generated > timedelta(hours=8 if evening else 14):
                  return False
              if generated.astimezone(now.tzinfo).date() not in ({day, now.date()} if minute < 120 else {day}):
                  return False
              if d.get("schema_version") != 1 or d.get("status") != "illustrative_model_maps":
                  return False
              for zone in ("period_maps", "france_maps"):
                  cards = {x["id"]: x for x in d[zone]}
                  if set(cards) != set(pairs):
                      return False
                  for j, h in pairs.items():
                      c = cards[j]
                      w = c.get("synoptic_consensus", {}).get("weights", {})
                      if (parse(c["run_utc"]["ifs"]) != expected or c["step_h"] != h or c["size_bytes"] < 15000
                          or c.get("synoptic_consensus", {}).get("method") != "weighted_blend"
                          or set(w) != {"ifs","aifs-single","gfs"} or not all(math.isfinite(v) and v > 0 for v in w.values())
                          or abs(sum(w.values()) - 1) >= 0.0001):
                          return False
              return True
          try:
              if ready(read("forecast-maps/tendance/tendance-cartes.json")):
                  print("Tendance : quatre cartes du cycle attendu déjà prêtes.", expected.isoformat())
                  sys.exit(1)
          except (OSError, ValueError, KeyError, TypeError):
              pass
          try:
              atlas = read("forecast-maps/europe/metadata.json")
              if not all(parse(atlas["runs_utc"]["ifs"][str(h)]) == expected for h in pairs.values()):
                  print("Tendance : attente de l'IFS complet", expected.isoformat())
                  sys.exit(1)
          except (OSError, ValueError, KeyError, TypeError):
              print("Tendance : atlas Europe indisponible.")
              sys.exit(1)
          print("Tendance : IFS complet mais cartes non prêtes, génération nécessaire.", expected.isoformat())
          PY
          then exit 0; fi
          gh run list --repo "$GH_REPO" --workflow tendance-analyse.yml --limit 20 \
            --json createdAt,updatedAt,status > /tmp/kfs-tendance-runs.json
          if python - <<'PY'
          import json, sys
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          runs = json.load(open("/tmp/kfs-tendance-runs.json"))
          if any(r.get("status") != "completed" for r in runs):
              print("Tendance : génération déjà active ou en attente.")
              sys.exit(0)
          if runs:
              last = max(datetime.fromisoformat(r["updatedAt"].replace("Z","+00:00")) for r in runs)
              if now - last < timedelta(minutes=15):
                  print("Tendance : dernière tentative il y a moins de 15 minutes.")
                  sys.exit(0)
          sys.exit(1)
          PY
          then exit 0; fi
          gh workflow run tendance-analyse.yml --repo "$GH_REPO" --ref main
          echo "Tendance : génération demandée; nouvelle vérification au prochain contrôle."
      - name: Installer le client legere ECMWF
        run: python -m pip install 'ecmwf-opendata>=0.3'
      - name: Identifier les dernieres sorties disponibles
        id: poll
        run: |
          python -m py_compile scripts/check_france_cycles.py
          python scripts/check_france_cycles.py
      - name: Vérifier les nouveaux runs Europe
        id: europe
        run: |
          python -m py_compile scripts/check_europe_cycles.py
          python scripts/check_europe_cycles.py
      - name: Déclencher /modele Europe dès disponibilité des sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EUROPE_NOAA: ${{ steps.europe.outputs.europe_noaa }}
          EUROPE_ECMWF: ${{ steps.europe.outputs.europe_ecmwf }}
        run: |
          set -euo pipefail
          for family in noaa ecmwf; do
            if [ "$family" = "noaa" ]; then
              [ "$EUROPE_NOAA" = "true" ] || continue
              workflow="previsions-noaa.yml"
            else
              [ "$EUROPE_ECMWF" = "true" ] || continue
              workflow="previsions-europe.yml"
            fi
            recent_json="$(gh run list --repo "$GH_REPO" --workflow "$workflow" --limit 4 \
              --json createdAt,status 2>/dev/null || echo '[]')"
            last_time="$(printf '%s' "$recent_json" | jq -r '.[0].createdAt // empty')"
            last_status="$(printf '%s' "$recent_json" | jq -r '.[0].status // empty')"
            if [ -n "$last_time" ]; then
              launched="$(date -u -d "$last_time" +%s 2>/dev/null || echo 0)"
              now="$(date -u +%s)"
              if [ "$last_status" != "completed" ] || [ "$((now-launched))" -lt 720 ]; then
                echo "Europe $family : génération en cours ou récente ($last_status), pas de doublon."
                continue
              fi
            fi
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main
            echo "Europe $family : nouvelle édition /modele demandée."
          done
      - name: Mettre a jour l'etat seulement si les cycles changent
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f forecast-maps/france/latest-cycles.json ]; then
            git add forecast-maps/france/latest-cycles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Mettre a jour disponibilite des runs France'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then exit 0; fi
              echo "La branche a change depuis le controle; recalculer plutot que fusionner le JSON."
              git fetch origin main
              git reset --hard origin/main
              python scripts/check_france_cycles.py
              git add forecast-maps/france/latest-cycles.json
              if git diff --cached --quiet; then exit 0; fi
              git commit -m 'Synchroniser disponibilite des derniers runs France'
              sleep 4
            done
            exit 1
          fi
      - name: Déclencher les derniers runs encore non publiés et réessayer les échecs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="forecast-maps/france/latest-cycles.json"
          if [ ! -s "$state" ]; then
            echo "Pas de fichier d'état NOAA/ECMWF : aucun run inventé."
            exit 0
          fi
          published_cycle() {
            local tag="$1"
            local folder
            folder="$(mktemp -d)"
            local cycle=""
            if gh release download "$tag" --repo "$GH_REPO" \
                --pattern metadata.json --dir "$folder" --clobber >/dev/null 2>&1; then
              cycle="$(jq -r '.run_utc // ""' "$folder/metadata.json" 2>/dev/null || true)"
            fi
            rm -rf "$folder"
            printf '%s' "$cycle"
          }
          for model in ifs gfs aifs-single aigfs; do
            latest="$(jq -r --arg model "$model" \
              '.models[$model].latest_first_step_utc // ""' "$state")"
            early="$(jq -r --arg model "$model" \
              'if .models[$model].early_12h_available_for_latest_run then .models[$model].latest_12h_temperature_step_utc else "" end // ""' "$state")"
            full="$(jq -r --arg model "$model" \
              'if .models[$model].temperature_72h_available_for_latest_run then .models[$model].latest_72h_temperature_step_utc else "" end // ""' "$state")"
            if [ -z "$latest" ]; then
              echo "SKIP $model : source non confirmée."
              continue
            fi
            if [ -n "$full" ] && [ "$full" = "$latest" ]; then
              previous="$(published_cycle "france-$model")"
              if [ -z "$previous" ] || [[ "$full" > "$previous" ]]; then
                echo "Nouveau run COMPLET $model : $full ; publié: $previous"
                gh workflow run france-h72.yml --repo "$GH_REPO" --ref main \
                  -f modele="$model" -f horizon=72
              else
                echo "Complet $model déjà publié ($previous)"
              fi
            elif [ -n "$early" ] && [ "$early" = "$latest" ]; then
              previous="$(published_cycle "france-$model-early")"
              if [ -z "$previous" ] || [[ "$early" > "$previous" ]]; then
                echo "Nouveau run PRÉCOCE $model : $early (+12 h), complet non disponible"
                gh workflow run france-h72.yml --repo "$GH_REPO" --ref main \
                  -f modele="$model" -f horizon=12
              else
                echo "Précoce $model déjà publié ($previous)"
              fi
            else
              echo "Run $model $latest détecté, fichiers +12 h encore incomplets."
            fi
          done
