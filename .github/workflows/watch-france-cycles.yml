name: KFS France - detection des nouveaux cycles (20 minutes)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_france_cycles.py'
      - '.github/workflows/watch-france-cycles.yml'
  schedule:
    - cron: '07,27,47 * * * *' # verification 20 min, sans declenchement de lourdes cartes

permissions:
  contents: write
  actions: write

concurrency:
  group: kfs-france-source-monitor
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le client legere ECMWF
        run: python -m pip install 'ecmwf-opendata>=0.3'
      - name: Identifier les dernieres sorties disponibles
        id: poll
        run: |
          python -m py_compile scripts/check_france_cycles.py
          python scripts/check_france_cycles.py
      - name: Mettre a jour l'etat seulement si les cycles changent
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f forecast-maps/france/latest-cycles.json ]; then
            git add forecast-maps/france/latest-cycles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Mettre a jour disponibilite des runs France'
            for attempt in 1 2 3 4; do
              if ! git pull --rebase; then
                git rebase --abort || true
                exit 1
              fi
              if git push; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Declencher les cartes France uniquement pour les nouveaux runs 72 h
        if: ${{ steps.poll.outputs.ready_models != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ steps.poll.outputs.ready_models }}
        run: |
          IFS=',' read -ra MODEL_ARRAY <<< "$MODELS"
          ecmwf_new=0
          noaa_new=0
          for model in "${MODEL_ARRAY[@]}"; do
            case "$model" in
              ifs|aifs-single)
                ecmwf_new=1
                echo "Nouveau run ECMWF : atlas France $model jusqu'a 72 h"
                gh workflow run france-h72.yml --ref main -f modele="$model" -f horizon=72
                ;;
              gfs|aigfs)
                noaa_new=1
                echo "Nouveau run NOAA : atlas France $model jusqu'a 72 h"
                gh workflow run france-h72.yml --ref main -f modele="$model" -f horizon=72
                ;;
              *) echo "Modele inconnu ignore : $model" ;;
            esac
          done
          # Conserver /modele Europe au plus proche des sorties sources.
          # Une seule regeneration par famille et par nouveau cycle.
          if [ "$ecmwf_new" = 1 ]; then
            echo "Actualiser IFS/AIFS Europe des la detection du nouveau run"
            gh workflow run previsions-europe.yml --ref main
          fi
          if [ "$noaa_new" = 1 ]; then
            echo "Actualiser GFS/AIGFS Europe des la detection du nouveau run"
            gh workflow run previsions-noaa.yml --ref main
          fi
