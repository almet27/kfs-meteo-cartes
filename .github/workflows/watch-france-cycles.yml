name: KFS France - detection des nouveaux cycles (10 minutes)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_france_cycles.py'
      - '.github/workflows/watch-france-cycles.yml'
  schedule:
    - cron: '03,13,23,33,43,53 * * * *' # controle chaque 10 min, publication progressive

permissions:
  contents: write
  actions: write

concurrency:
  group: kfs-france-source-monitor
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le client legere ECMWF
        run: python -m pip install 'ecmwf-opendata>=0.3'
      - name: Identifier les dernieres sorties disponibles
        id: poll
        run: |
          python -m py_compile scripts/check_france_cycles.py
          python scripts/check_france_cycles.py
      - name: Mettre a jour l'etat seulement si les cycles changent
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f forecast-maps/france/latest-cycles.json ]; then
            git add forecast-maps/france/latest-cycles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Mettre a jour disponibilite des runs France'
            for attempt in 1 2 3 4; do
              if ! git pull --rebase; then
                git rebase --abort || true
                exit 1
              fi
              if git push; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Actualiser uniquement la France aux premieres échéances disponibles
        if: ${{ steps.poll.outputs.ready_models != '' || steps.poll.outputs.early_models != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETE: ${{ steps.poll.outputs.ready_models }}
          EARLY: ${{ steps.poll.outputs.early_models }}
        run: |
          # Aucune commande ne touche aux workflows ni aux cartes Europe.
          if [ -n "$EARLY" ]; then
            IFS=',' read -ra EARLY_ARRAY <<< "$EARLY"
            for model in "${EARLY_ARRAY[@]}"; do
              case "$model" in
                ifs|aifs-single|gfs|aigfs)
                  echo "Premieres echeances disponibles : +12 h $model"
                  gh workflow run france-h72.yml --ref main -f modele="$model" -f horizon=12
                  ;;
              esac
            done
          fi
          if [ -n "$COMPLETE" ]; then
            IFS=',' read -ra FULL_ARRAY <<< "$COMPLETE"
            for model in "${FULL_ARRAY[@]}"; do
              case "$model" in
                ifs|aifs-single|gfs|aigfs)
                  echo "Nouveau cycle complet France : +72 h $model"
                  gh workflow run france-h72.yml --ref main -f modele="$model" -f horizon=72
                  ;;
              esac
            done
          fi
