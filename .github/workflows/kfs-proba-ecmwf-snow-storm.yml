name: KFS PROBA - ECMWF ENS subset snow and storm
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_ecmwf_snow_storm.py
      - .github/workflows/kfs-proba-ecmwf-snow-storm.yml
  schedule:
    - cron: '30 12,16 * * *'

permissions:
  contents: write

concurrency:
  group: kfs-ecmwf-ens-snow-storm
  cancel-in-progress: false

jobs:
  probabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-proba.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-data
          python -m pip install -r scripts/requirements-ecmwf-proba.txt
      - name: Check Python syntax
        run: python -m py_compile scripts/build_ecmwf_snow_storm.py
      - name: Download selected ENS members and calculate indicative risk
        env:
          ECMWF_SOURCE: ecmwf
        run: python scripts/build_ecmwf_snow_storm.py
      - name: Publish risk JSON only when complete
        run: |
          git config user.name "KFS METEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add proba/ecmwf-subset-probabilities.json
          if ! git diff --cached --quiet; then
            git commit -m "KFS: risques neige et orages ECMWF echantillon ENS"
            git push
          fi
