name: KFS PROBA - ECMWF ENS and GEFS probabilities
on:
  workflow_dispatch:
  push:
    paths:
      - proba/points-ecmwf.json
      - scripts/build_proba_ensembles.cjs
      - scripts/merge_proba_ensembles.cjs
      - cloudflare/kfs-proba-module.js
      - tests/test-proba-5days.cjs
      - tests/test-proba-build-resume.cjs
      - tests/test-proba-ensembles.cjs
      - .github/workflows/kfs-proba-5days.yml
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: kfs-proba-5days
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.cycles.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check latest published ensemble cycles
        id: cycles
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const now = Date.now();
          const hour = 3600000;
          const today = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(now));
          let data = {};
          try { data = JSON.parse(fs.readFileSync('proba/ensemble-probabilities.json','utf8')); }
          catch (e) { console.log('No readable published dataset:', e.message); }
          async function latest(id) {
            try {
              const r = await fetch('https://api.open-meteo.com/data/'+id+'/static/meta.json?ts='+now, {cache:'no-store',signal:AbortSignal.timeout(8000)});
              if (!r.ok) throw Error('HTTP '+r.status);
              const j = await r.json();
              const millis = v => Number(v) > 1e12 ? Number(v) : Number(v)*1000;
              const init = millis(j.last_run_initialisation_time), availability = millis(j.last_run_availability_time);
              if (!Number.isFinite(init)||!Number.isFinite(availability)||availability<init||availability>now-600000||now-init>7*24*hour) return null;
              const d = new Date(init);
              if (![0,6,12,18].includes(d.getUTCHours())||d.getUTCMinutes()!==0) return null;
              return {run:d.toISOString(),availability};
            } catch(e) { console.log(id, e.message); return null; }
          }
          function needsUpdate(model, cycle) {
            const acquired = Date.parse(model?.generated_at_utc);
            const finalDay = new Date(Date.parse(today+'T12:00:00Z')+5*24*hour).toISOString().slice(0,10);
            if (!Number.isFinite(acquired)||model?.periods?.['0']?.start_day!==today||
                model?.periods?.['5']?.end_day!==finalDay||model?.periods?.['6']?.end_day!==finalDay) return true;
            if (now-acquired>=6*hour) return true;
            if (!cycle) return false;
            const zones = model.periods?.['0']?.zones || {};
            const values = Object.values(zones).flatMap(z=>z.pluie?.['1']||[]).filter(Boolean);
            const runs = new Set(values.map(v=>v.run_utc).filter(Boolean));
            if ([...runs].some(run=>Date.parse(run)<Date.parse(cycle.run))) return true;
            // A model generation predating availability cannot contain the new cycle.
            if (acquired<cycle.availability) return true;
            // Retry missing provenance hourly, not every 15 minutes.
            if ((!values.length||values.some(v=>!v.run_utc))&&now-acquired>=hour) return true;
            return false;
          }
          (async()=>{
            const ids=['ecmwf_ifs025_ensemble','ncep_gefs025'];
            const cycles=await Promise.all(ids.map(latest));
            const decisions=ids.map((id,i)=>{
              const model=data.models?.[id], cycle=cycles[i], needed=needsUpdate(model,cycle);
              console.log(id, 'available cycle:',cycle?.run||'unverified','published acquisition:',model?.generated_at_utc||'none','rebuild:',needed);
              return needed;
            });
            const expected=JSON.parse(fs.readFileSync('proba/points-ecmwf.json','utf8')).zones;
            const gridChanged=JSON.stringify(data.zone_points)!==JSON.stringify(expected);
            console.log('Ensemble grid changed:',gridChanged);
            const rebuild=process.env.EVENT_NAME!=='schedule'||gridChanged||decisions.some(Boolean);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'rebuild='+rebuild+'\n');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
  probabilities:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [ecmwf_ifs025_ensemble, ncep_gefs025]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test probabilities and equal model weights
        run: node --test tests/test-proba-5days.cjs tests/test-proba-build-resume.cjs tests/test-proba-ensembles.cjs
      - uses: actions/cache/restore@v4
        with:
          path: proba/ensemble-checkpoint-${{ matrix.model }}-${{ matrix.shard }}.json
          key: kfs-proba-v2-${{ matrix.model }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kfs-proba-v2-${{ matrix.model }}-${{ matrix.shard }}-
      - name: Calculate daily and five-day member probabilities
        env:
          PROBA_MODEL: ${{ matrix.model }}
          PROBA_SHARD_TOTAL: '2'
          PROBA_SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/build_proba_ensembles.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: proba-ensemble-${{ matrix.model }}-${{ matrix.shard }}
          path: proba/ensemble-shard-${{ matrix.model }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: proba/ensemble-checkpoint-${{ matrix.model }}-${{ matrix.shard }}.json
          key: kfs-proba-v2-${{ matrix.model }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
  publish:
    needs: probabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: proba-ensemble-*
          path: ensemble-shards
          merge-multiple: true
      - name: Validate and merge all source points
        run: node scripts/merge_proba_ensembles.cjs ensemble-shards
      - name: Publish validated dataset
        run: |
          git config user.name "KFS METEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add proba/ensemble-probabilities.json proba/public-ensembles/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KFS: ECMWF ENS and GEFS probabilities"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
