name: EUMETSAT LI — carte des éclairs optiques KFS

on:
  schedule:
    # Produits LFL agrégés par cycles d'environ 10 min.
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  # Le radar RainViewer est déjà déclenché toutes les cinq minutes par KFS.
  # Repli événementiel indépendant de la planification GitHub.
  workflow_run:
    workflows: ["Publier radar RainViewer pour Discord"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    paths:
      - 'foudre-li/collect.py'
      - 'foudre-li/test_collect.py'
      - '.github/workflows/eumetsat-li-foudre.yml'

permissions:
  contents: write

concurrency:
  group: kfs-eumetsat-li-collect
  cancel-in-progress: false

jobs:
  lfl:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: foudre-li/requirements.txt
      - name: Vérifier les secrets sans afficher leur valeur
        id: auth
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        shell: bash
        run: |
          if [[ -n "$EUMETSAT_CONSUMER_KEY" && -n "$EUMETSAT_CONSUMER_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Collecte EUMETSAT non activée : deux secrets Actions requis."
            exit 1
          fi
      - name: Installer les dépendances EUMETSAT
        run: python -m pip install --disable-pip-version-check -r foudre-li/requirements.txt
      - name: Tester le décodeur sans réseau ni secrets
        run: |
          python -m py_compile foudre-li/collect.py foudre-li/test_collect.py
          python -m unittest discover -s foudre-li -p 'test_*.py' -v
      - name: Collecter les nouvelles observations officielles
        if: steps.auth.outputs.ready == 'true'
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: python foudre-li/collect.py --out foudre-li/flash-points.json
      - name: Publier les observations sans toucher aux autres fichiers
        if: steps.auth.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foudre-li/flash-points.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les éclairs satellitaires EUMETSAT LI"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          else
            echo "Aucun nouveau produit LI : carte inchangée."
          fi
