name: KFS - verifier acces IFS Extended
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_extended_charts.py'
      - '.github/workflows/check-ifs-extended.yml'
  schedule:
    - cron: '20 7 * * 0'
permissions:
  contents: read
jobs:
  verify-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Découvrir les produits ECMWF Extended accessibles
        run: python scripts/check_extended_charts.py
      - name: Archiver le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifs-extended-access
          path: forecast-maps/tendance/extended-access.json
          if-no-files-found: warn
