name: KFS rainfall verification tests
on:
  workflow_dispatch:
  push:
    paths: ['scripts/kfs_precip_verification.py','.github/workflows/kfs-precip-verification-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: python scripts/kfs_precip_verification.py --test
