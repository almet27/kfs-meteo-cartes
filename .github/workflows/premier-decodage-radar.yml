name: Premier decodage radar Meteo-France
on:
  workflow_dispatch:
jobs:
  decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dependances
        run: python -m pip install --disable-pip-version-check numpy pandas matplotlib pyproj scipy
      - name: Decoder et dessiner la reflectivite
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p radar-sortie
          python - <<'PY'
          import os,json,gzip,urllib.request,urllib.error,pathlib,sys,time
          import numpy as np
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          root='https://raw.githubusercontent.com/theperk08/Meteo_France_Radars/main/'
          def get(url,headers=None):
              req=urllib.request.Request(url,headers=headers or {'User-Agent':'KFS-Meteo-Radar/1.0'})
              label='Meteo-France API' if 'meteofrance.fr' in url else 'Tables/decodeur GitHub'
              for attempt in range(1,5):
                  try:
                      print(f'Telechargement {label} - essai {attempt}/4',flush=True)
                      with urllib.request.urlopen(req,timeout=90) as r:return r.read()
                  except urllib.error.HTTPError as exc:
                      print(f'Erreur HTTP {exc.code} sur {label} (essai {attempt}/4)',flush=True)
                      if exc.code not in (429,500,502,503,504) or attempt==4:raise
                  except (urllib.error.URLError,TimeoutError) as exc:
                      print(f'Erreur reseau sur {label}: {type(exc).__name__} (essai {attempt}/4)',flush=True)
                      if attempt==4:raise
                  time.sleep(min(2**attempt*5,40))
          if not os.environ.get('METEOFRANCE_API_KEY'):raise RuntimeError('Secret METEOFRANCE_API_KEY manquant')
          endpoint='https://public-api.meteofrance.fr/public/DPRadar/v1/mosaiques/METROPOLE/observations/REFLECTIVITE'
          metadata=json.loads(get(endpoint,{'apikey':os.environ['METEOFRANCE_API_KEY'],'User-Agent':'KFS-Meteo-Radar/1.0'}))
          # Conserver l'heure exacte du produit pour une comparaison externe.
          # Ne jamais sauvegarder les URLs de telechargement (potentiellement signees).
          from datetime import datetime,timezone
          captured_utc=datetime.now(timezone.utc).isoformat(timespec='seconds')
          product_times={}
          for key in ('date','datetime','time','timestamp','validityTime','validityDate','observationTime','dateObservation','updated','lastUpdate'):
              if key in metadata:
                  product_times[key]=metadata[key]
          print('HORODATAGE CAPTURE UTC:',captured_utc,flush=True)
          print('HORODATAGE METADONNEES:',product_times,flush=True)
          links=metadata.get('links',[])
          candidates=[l['href'] for l in links if l.get('rel','').endswith('/data') and l.get('href')]
          if not candidates:raise RuntimeError('Aucun lien BUFR dans la reponse : '+str(links)[:900])
          data=get(candidates[0],{'apikey':os.environ['METEOFRANCE_API_KEY'],'User-Agent':'KFS-Meteo-Radar/1.0'})
          raw=gzip.decompress(data) if data[:2]==b'\x1f\x8b' else data
          if raw[:4]!=b'BUFR':raise RuntimeError('Fichier non BUFR')
          work=pathlib.Path('radar-sortie')
          (work/'radar.bufr').write_bytes(raw)
          tables=work/'tables'
          tables.mkdir(exist_ok=True)
          for name in ['bufrtabb_16.csv','bufrtabd_16.csv','localtabb_85_14.csv','localtabd_85_14.csv']:
              (tables/name).write_bytes(get(root+'tables/'+name))
          notebook=json.loads(get(root+'MeteoFrance_Bufr_Decoder.ipynb'))
          ns={}
          exec('import os,gzip,math,numpy as np,pandas as pd',ns)
          for idx in [5,6,7,8,9,10,11]:
              exec(''.join(notebook['cells'][idx]['source']),ns)
          ns.update(DIR_PATH=str(work),FILE_NAME='radar.bufr',DIR_PATH_TABLE=str(tables),
              FIC_TAB_B='bufrtabb_{master}.csv',FIC_TAB_D='bufrtabd_{master}.csv',
              FIC_LOCAL_TAB_B='localtabb_{center}_{local}.csv',
              FIC_LOCAL_TAB_D='localtabd_{center}_{local}.csv',affiche_descriptors=False)
          print('BUFR taille:',len(raw),'octets',flush=True)
          ns['deco_bufr']()
          messages=ns.get('datas_messages',[])
          print('Messages decodes:',len(messages),flush=True)
          # Heure d'observation extraite du BUFR (et non heure du telechargement).
          # Indispensable pour comparer une image radar externe au meme instant.
          obs_times=[]
          for msg in messages:
              keys=('Year','Month','Day','Hour','Minute','Second')
              if not all(msg.get(k) for k in keys):
                  continue
              try:
                  from datetime import datetime,timezone
                  dt=datetime(*(int(msg[k][0]) for k in keys),tzinfo=timezone.utc)
                  obs_times.append(dt.isoformat(timespec='seconds'))
              except (ValueError,TypeError,IndexError) as exc:
                  print('AVERTISSEMENT date BUFR:',str(exc),flush=True)
          observation_utc=obs_times[0] if obs_times else None
          print('HORODATAGE OBSERVATION BUFR UTC:',observation_utc,flush=True)
          (work/'horodatage-observation-radar.json').write_text(
              json.dumps({'observation_utc':observation_utc,
                          'capture_utc':captured_utc,
                          'source':'Meteo-France DPRadar BUFR',
                          'comparaison_externe_validee':False},
                         indent=2,ensure_ascii=False),encoding='utf-8')
          for i,m in enumerate(messages):
              print('Message',i,'champs:',[(k,len(v)) for k,v in m.items()],flush=True)
          for m in messages:
              if 'Horizontal reflectivity' not in m:continue
              nx=int(m['Number of pixels per row'][0])
              ny=int(m['Number of pixels per column'][0])
              arr=np.asarray(m['Horizontal reflectivity'],dtype=float)
              if arr.size!=nx*ny:raise RuntimeError(f'Grille incompatible {arr.size} vs {nx}x{ny}')
              arr=arr.reshape(ny,nx)
              unique,counts=np.unique(arr,return_counts=True)
              print('Valeurs les plus frequentes:',sorted(zip(counts.tolist(),unique.tolist()),reverse=True)[:15],flush=True)
              print('Plage valeurs:',float(np.nanmin(arr)),float(np.nanmax(arr)),flush=True)
              for key in ['Projection type','Coordinate grid type','Latitude (high accuracy)','Longitude (high accuracy)','Latitude de reference','Longitude du meridien parallele a l\'axe des Y','Mode de balayage','Pixel size on horizontal - 1','Pixel size on horizontal - 2']:
                  print('GEO',key,':',m.get(key,[])[:6],flush=True)
              # Les valeurs sentinelles BUFR hors plage meteorologique ne sont pas des precipitations.
              # Masquage conservateur avant le georeferencement de la mosaïque.
              valid=np.isfinite(arr)&(arr>=0)&(arr<=70)
              shown=np.ma.masked_where(~valid,arr)
              cmap=plt.get_cmap('turbo').copy()
              cmap.set_bad((1,1,1,0))
              fig,ax=plt.subplots(figsize=(10,10),dpi=130)
              ax.set_facecolor('#e9edf2')
              im=ax.imshow(shown,origin='upper',vmin=0,vmax=55,cmap=cmap,interpolation='nearest')
              ax.set_title('Meteo-France — Reflectivite radar (dBZ) — valeurs manquantes masquees')
              ax.set_xlabel('Pixels radar (georeferencement en cours)')
              fig.colorbar(im,ax=ax,label='dBZ')
              fig.tight_layout()
              fig.savefig(work/'premiere-reflectivite.png')
              # Diagnostic geographique: Lambert conique conforme, origine NW donnee par BUFR.
              # On produit quatre orientations afin de verifier le sens de balayage avant publication.
              from pyproj import CRS,Transformer
              from matplotlib.patches import Rectangle
              import matplotlib.patheffects as pe
              crs=CRS.from_proj4('+proj=lcc +lat_1=45 +lat_0=45 +lon_0=0 +datum=WGS84 +units=m +no_defs')
              forward=Transformer.from_crs('EPSG:4326',crs,always_xy=True)
              lon0=float(m['Longitude (high accuracy)'][0])
              lat0=float(m['Latitude (high accuracy)'][0])
              x0,y0=forward.transform(lon0,lat0)
              print('PROJECTION DIAGNOSTIC: point 0 lat/lon',lat0,lon0,'XY',x0,y0,flush=True)
              cities={'Bourth':(0.81,48.77),'Paris':(2.3522,48.8566),'Rouen':(1.0993,49.4431),'Caen':(-0.3707,49.1829),'Le Mans':(0.1996,48.0061),'Orleans':(1.9093,47.9029),'Lille':(3.0573,50.6292)}
              # Diagnostic de TOUS les points geographiques annonces par le BUFR.
              scan=int(m['Mode de balayage'][0])
              latitudes=[float(v) for v in m['Latitude (high accuracy)']]
              longitudes=[float(v) for v in m['Longitude (high accuracy)']]
              print('BUFR POINTS GEO COMPLETS:',list(zip(latitudes,longitudes)),flush=True)
              print('BUFR SCAN:',scan,'bit128:',bool(scan&128),'bit64:',bool(scan&64),'bit32:',bool(scan&32),flush=True)
              print('BUFR DIMENSIONS:',nx,ny,'PIXEL:',m['Pixel size on horizontal - 1'],m['Pixel size on horizontal - 2'],flush=True)
              fig2,axes=plt.subplots(2,4,figsize=(20,11),dpi=110)
              # Hypothese A: donnees en lignes; hypothese B: donnees en colonnes.
              # On fixe le premier pixel en haut/gauche ou en bas/droite selon les directions.
              for row,transposed in enumerate((False,True)):
                  base=arr.T if transposed else arr
                  for col,(sx,sy) in enumerate(((1,-1),(-1,-1),(1,1),(-1,1))):
                      ax=axes[row,col]
                      # L'image ne doit PAS etre retournee en plus de l'inversion des axes.
                      x1=x0+sx*nx*1000
                      y1=y0+sy*ny*1000
                      extent=[min(x0,x1),max(x0,x1),min(y0,y1),max(y0,y1)]
                      masked=np.ma.masked_where(~(np.isfinite(base)&(base>=0)&(base<=70)),base)
                      ax.imshow(masked,extent=extent,origin='upper' if sy<0 else 'lower',
                                cmap=cmap,vmin=0,vmax=55,interpolation='nearest')
                      for city,(lon,lat) in cities.items():
                          cx,cy=forward.transform(lon,lat)
                          ax.plot(cx,cy,'ko',markersize=2)
                          ax.text(cx+7000,cy+7000,city,fontsize=7,color='black',
                                  path_effects=[pe.withStroke(linewidth=2,foreground='white')])
                      for idx,(lat,lon) in enumerate(zip(latitudes,longitudes)):
                          px,py=forward.transform(lon,lat)
                          ax.plot(px,py,'mx',markersize=5)
                          ax.text(px+7000,py-12000,str(idx),color='magenta',fontsize=9,
                                  path_effects=[pe.withStroke(linewidth=2,foreground='white')])
                      bx,by=forward.transform(*cities['Bourth'])
                      ax.add_patch(Rectangle((bx-150000,by-150000),300000,300000,
                                             fill=False,edgecolor='magenta',linewidth=1.3))
                      ax.set_xlim(bx-900000,bx+900000)
                      ax.set_ylim(by-850000,by+850000)
                      ax.set_aspect('equal')
                      ax.grid(alpha=.15)
                      ax.set_title(f'Transpose={transposed}, x={sx:+d}, y={sy:+d}',fontsize=10)
              fig2.suptitle('Diagnostic origine BUFR : croix magenta = tous les points geographiques (NON VALIDE)',fontsize=14)
              fig2.tight_layout()
              fig2.savefig(work/'diagnostic-georeferencement.png')
              print('DIAGNOSTIC GEO GENERE:',work/'diagnostic-georeferencement.png',flush=True)
              # Carte de reference avec limites administratives (projection radar provisoire).
              fig3,ax3=plt.subplots(figsize=(10,10),dpi=130)
              ax3.set_facecolor('#edf2f5')
              def draw_geometry(coords,kind,transformer,color,width):
                  def ring(points):
                      if len(points)<2:return
                      xy=[transformer.transform(float(p[0]),float(p[1])) for p in points]
                      ax3.plot([p[0] for p in xy],[p[1] for p in xy],color=color,lw=width,alpha=.85,zorder=3)
                  if kind=='Polygon':
                      for r in coords:ring(r)
                  elif kind=='MultiPolygon':
                      for polygon in coords:
                          for r in polygon:ring(r)
              layers=[
                  ('departements','https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements.geojson','#8094a4',.65),
                  ('pays','https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson','#263c52',1.4)]
              for label,url,color,width in layers:
                  try:
                      features=json.loads(get(url)).get('features',[])
                      for feature in features:
                          geom=feature.get('geometry') or {}
                          draw_geometry(geom.get('coordinates',[]),geom.get('type'),forward,color,width)
                      print('FRONTIERES',label,'dessinees:',len(features),flush=True)
                  except Exception as exc:
                      print('AVERTISSEMENT frontieres',label,type(exc).__name__,str(exc)[:160],flush=True)
              bx,by=forward.transform(*cities['Bourth'])
              # ATTENTION : georeferencement des echos non valide; afficher les limites et les villes
              # sans superposer des precipitations potentiellement decalees.
              for city,(lon,lat) in cities.items():
                  cx,cy=forward.transform(lon,lat)
                  if abs(cx-bx)<160000 and abs(cy-by)<160000:
                      ax3.plot(cx,cy,'o',color='#172e48',markersize=4,zorder=5)
                      ax3.text(cx+4500,cy+4500,city,fontsize=9,color='#172e48',zorder=5)
              # Etiquettes des departements : coordonnees approximatives de leur chef-lieu.
              departments={
                  'Eure':(1.15,49.02),'Orne':(0.15,48.59),
                  'Calvados':(-0.60,49.10),'Seine-Maritime':(0.85,49.65),
                  'Eure-et-Loir':(1.30,48.35),'Yvelines':(1.85,48.75),
                  'Sarthe':(0.20,48.15),'Oise':(2.40,49.42),
                  'Manche':(-1.20,49.10),'Mayenne':(-0.65,48.30)
              }
              for name,(lon,lat) in departments.items():
                  dx,dy=forward.transform(lon,lat)
                  if abs(dx-bx)<140000 and abs(dy-by)<140000:
                      ax3.text(dx,dy,name,fontsize=8,color='#62788a',ha='center',alpha=.9,zorder=4,
                          path_effects=[pe.withStroke(linewidth=2,foreground='#edf2f5')])
              # Barre d'echelle dans la projection metrique.
              scale_x=bx-130000
              scale_y=by-128000
              ax3.plot([scale_x,scale_x+50000],[scale_y,scale_y],color='#233e54',lw=3,zorder=8)
              ax3.plot([scale_x,scale_x],[scale_y-3500,scale_y+3500],color='#233e54',lw=2,zorder=8)
              ax3.plot([scale_x+50000,scale_x+50000],[scale_y-3500,scale_y+3500],color='#233e54',lw=2,zorder=8)
              ax3.text(scale_x+25000,scale_y+6500,'50 km',ha='center',fontsize=10,color='#233e54',zorder=8)
              # Premiere superposition de DIAGNOSTIC uniquement : le premier couple
              # lat/lon est le point de grille; les 34 suivants sont des radars.
              print('COORDONNEES: 1 origine de grille + 34 positions radar (34 stations WMO)',flush=True)
              print('BUFR origine grille:',latitudes[0],longitudes[0],flush=True)
              fig4,ax4=plt.subplots(figsize=(11,11),dpi=130)
              ax4.set_facecolor('#edf2f5')
              # 1536 km depuis le premier point en direction est/sud.
              extent=[x0,x0+nx*1000,y0-ny*1000,y0]
              masked=np.ma.masked_where(~(np.isfinite(arr)&(arr>=0)&(arr<=70)),arr)
              ax4.imshow(masked,extent=extent,origin='upper',cmap=cmap,vmin=0,vmax=55,
                         alpha=.85,interpolation='nearest',zorder=2)
              # Dessiner le fond PAR-DESSUS les echos pour conserver les limites lisibles.
              old_ax3=ax3
              ax3=ax4
              for label,url,color,width in layers:
                  try:
                      features=json.loads(get(url)).get('features',[])
                      for feature in features:
                          geom=feature.get('geometry') or {}
                          draw_geometry(geom.get('coordinates',[]),geom.get('type'),forward,color,width)
                  except Exception as exc:
                      print('AVERTISSEMENT couche diagnostic:',label,str(exc)[:120],flush=True)
              ax3=old_ax3
              for city,(lon,lat) in cities.items():
                  cx,cy=forward.transform(lon,lat)
                  if abs(cx-bx)<160000 and abs(cy-by)<160000:
                      ax4.plot(cx,cy,'ko',markersize=3,zorder=5)
                      ax4.text(cx+4000,cy+4000,city,fontsize=9,zorder=5,
                               path_effects=[pe.withStroke(linewidth=2,foreground='white')])
              ax4.plot(bx,by,'*',color='#e22653',markersize=15,zorder=6)
              ax4.set_xlim(bx-150000,bx+150000)
              ax4.set_ylim(by-150000,by+150000)
              ax4.set_aspect('equal')
              ax4.set_title('DIAGNOSTIC — Radar + frontieres autour de Bourth (calage non valide)')
              ax4.text(.5,.02,'POSITION DES ECHOS A VERIFIER — NE PAS UTILISER COMME PREVISION',
                       transform=ax4.transAxes,ha='center',color='#b91c1c',fontsize=9,
                       bbox={'facecolor':'white','alpha':.9,'edgecolor':'none'})
              fig4.tight_layout()
              fig4.savefig(work/'diagnostic-radar-sur-carte-bourth.png')
              print('SUPERPOSITION TEST GENEREE:',work/'diagnostic-radar-sur-carte-bourth.png',flush=True)
              # Diagnostic strict du scan BUFR (bits WMO 128/64/32).
              # 128 : i negatif; 64 : j positif; 32 : points consecutifs suivant j.
              # Ne pas publier avant confirmation du sens et du coin de reference.
              scan_i=-1 if scan&128 else 1
              scan_j=1 if scan&64 else -1
              adjacent_j=bool(scan&32)
              dx=float(m['Pixel size on horizontal - 1'][0])
              dy=float(m['Pixel size on horizontal - 2'][0])
              print('SCAN WMO i,j,adjacent-j:',scan_i,scan_j,adjacent_j,flush=True)
              # Diagnostic metadonnees avant toute nouvelle hypothese de projection.
              for key,values in m.items():
                  if any(word in key.lower() for word in
                         ('projection','grid','pixel','scann','balay','latitude',
                          'longitude','reference','meridian','parall','origin','angle')):
                      print('BUFR GEO META:',repr(key),'count=',len(values),
                            'values=',repr(values[:12]),flush=True)
              print('SCAN BIT MASKS:',{bit:bool(scan&bit) for bit in (128,64,32,16,8,4,2,1)},flush=True)
              print('PIXEL UNITS RAW:',repr(m['Pixel size on horizontal - 1'][:3]),
                    repr(m['Pixel size on horizontal - 2'][:3]),flush=True)

              # Controle objectif : combien de radars declares dans le BUFR tombent
              # dans l'emprise de la grille ? Une mosaique nationale devrait couvrir
              # une grande majorite des stations, pas zero.
              station_xy=[forward.transform(lon,lat) for lat,lon in
                          zip(latitudes[1:],longitudes[1:])]
              print('BUFR STATIONS GEO:',len(station_xy),flush=True)
              for label,si,sj in [('flags-224',scan_i,scan_j),
                                   ('nord-ouest',1,-1),('nord-est',-1,-1),
                                   ('sud-ouest',1,1),('sud-est',-1,1)]:
                  xx=x0+si*nx*dx
                  yy=y0+sj*ny*dy
                  xlo,xhi=sorted((x0,xx))
                  ylo,yhi=sorted((y0,yy))
                  inside=[i for i,(px,py) in enumerate(station_xy,1)
                          if xlo<=px<=xhi and ylo<=py<=yhi]
                  print('EMPRISE DIAGNOSTIC',label,
                        'limites=',tuple(round(v) for v in (xlo,xhi,ylo,yhi)),
                        'stations_couvertes=',len(inside),'sur',len(station_xy),
                        'indices=',inside,flush=True)
              if not station_xy:
                  print('AVERTISSEMENT: aucun radar station identifiable',flush=True)
              elif not any(x0<=px<=x0+nx*dx and y0-ny*dy<=py<=y0
                           for px,py in station_xy):
                  print('ALERTE: meme l hypothese nord-ouest ne couvre aucune station',flush=True)
              # Rapport reproductible : separer l'emprise geographique du
              # parcours des pixels. Les flags 224 ne prouvent pas a eux seuls
              # l'orientation de la matrice dans ce produit local.
              audit={
                  'statut':'NON_VALIDE',
                  'capture_utc':captured_utc,
                  'horodatage_produit':product_times,
                  'reference_externe':'A comparer a une image radar independante au meme instant UTC',
                  'raison':'Ordre des pixels non confirme par reference externe horodatee',
                  'source':'Meteo-France DPRadar REFLECTIVITE METROPOLE',
                  'grille':{'largeur':nx,'hauteur':ny,'pas_x_m':dx,'pas_y_m':dy},
                  'point_reference':{'latitude':lat0,'longitude':lon0,
                                     'x_lambert_provisoire_m':x0,
                                     'y_lambert_provisoire_m':y0},
                  'projection':{'type_bufr':m.get('Projection type',[None])[0],
                                'latitude_reference':m.get('Latitude de reference',[None])[0],
                                'longitude_meridien_y':m.get("Longitude du meridien parallele a l'axe des Y",[None])[0],
                                'proj4_diagnostic':crs.to_proj4()},
                  'balayage':{'valeur':scan,'i_negatif':bool(scan&128),
                               'j_positif':bool(scan&64),
                               'points_consecutifs_j':bool(scan&32)},
                  'stations':{'nombre':len(station_xy)},
                  'hypotheses_emprise':{}
              }
              for label,si,sj in [('flags-224',scan_i,scan_j),
                                   ('nord-ouest',1,-1),('nord-est',-1,-1),
                                   ('sud-ouest',1,1),('sud-est',-1,1)]:
                  xx=x0+si*nx*dx
                  yy=y0+sj*ny*dy
                  xmin,xmax=sorted((x0,xx))
                  ymin,ymax=sorted((y0,yy))
                  covered=sum(xmin<=px<=xmax and ymin<=py<=ymax
                              for px,py in station_xy)
                  audit['hypotheses_emprise'][label]={
                      'stations_couvertes':covered,
                      'xmin':xmin,'xmax':xmax,'ymin':ymin,'ymax':ymax}
              (work/'audit-georeferencement.json').write_text(
                  json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
              print('AUDIT GEO JSON: emprise nord-ouest couvre',
                    audit['hypotheses_emprise']['nord-ouest']['stations_couvertes'],
                    'stations sur',len(station_xy),flush=True)
              if len(station_xy) and audit['hypotheses_emprise']['nord-ouest']['stations_couvertes']!=len(station_xy):
                  raise RuntimeError('Emprise nord-ouest incompatible avec les stations BUFR')
              # Les emprises ne suffisent pas a valider le sens de balayage :
              # il faut ensuite verifier la projection et la convention du produit.
              # L'ordre j-adjacent signifie reshape(nx,ny).T, et non reshape(ny,nx).
              canonical=np.asarray(m['Horizontal reflectivity'],dtype=float)
              canonical=canonical.reshape(nx,ny).T if adjacent_j else canonical.reshape(ny,nx)
              fig5,axes5=plt.subplots(2,2,figsize=(15,14),dpi=120)
              for row,base in enumerate((arr,canonical)):
                  for col,mode in enumerate(('BUFR flags','NW reference')):
                      ax=axes5[row,col]
                      if mode=='BUFR flags':
                          xi,yj=scan_i,scan_j
                      else:
                          xi,yj=1,-1
                      xe=x0+xi*nx*dx
                      ye=y0+yj*ny*dy
                      plot=np.ma.masked_where(~(np.isfinite(base)&(base>=0)&(base<=70)),base)
                      # Le premier pixel est au point (x0,y0). L'orientation
                      # doit suivre les signes i/j, sans inversion supplementaire.
                      # extent est [x_gauche,x_droite,y_bas,y_haut] ; origin='upper'
                      # met la premiere ligne du cote y_haut.
                      ybottom,ytop=(ye,y0) if yj<0 else (y0,ye)
                      ax.imshow(plot,extent=[x0,xe,ybottom,ytop],
                                origin='upper' if yj<0 else 'lower',
                                cmap=cmap,vmin=0,vmax=55,interpolation='nearest',alpha=.85)
                      ax.plot(x0,y0,marker='X',color='red',markersize=8,zorder=8)
                      ax.text(x0+12000,y0,'Origine BUFR',fontsize=8,color='red')
                      print('SCAN EXTENT:',mode,'transpose=',bool(row),
                            'first=',(x0,y0),'last=',(xe,ye),
                            'dxdy=',(dx,dy),flush=True)
                      for city,(lon,lat) in cities.items():
                          cx,cy=forward.transform(lon,lat)
                          ax.plot(cx,cy,'ko',markersize=2)
                          ax.text(cx+7000,cy+7000,city,fontsize=8,color='black',
                                  path_effects=[pe.withStroke(linewidth=2,foreground='white')])
                      for idx,(lat,lon) in enumerate(zip(latitudes[1:],longitudes[1:]),start=1):
                          px,py=forward.transform(lon,lat)
                          ax.plot(px,py,'m.',markersize=3)
                      ax.set_xlim(-650000,650000)
                      ax.set_ylim(-200000,1100000)
                      ax.set_aspect('equal')
                      ax.grid(alpha=.15)
                      ax.set_title(f'{"Colonne-adjacente" if row else "Ligne-adjacente"} / {mode}')
              fig5.suptitle('Validation balayage BUFR 224 — vue France entiere, radar non valide',fontsize=14)
              fig5.tight_layout()
              fig5.savefig(work/'diagnostic-scan-bufr-france.png')
              print('SCAN DIAGNOSTIC GENERE:',work/'diagnostic-scan-bufr-france.png',flush=True)
              # Comparaison utile: les quatre arrangements des pixels sur la
              # SEULE emprise couvrant les 34 stations. Le mode 224 indique
              # l'ordre de parcours, mais ne suffit pas a prouver l'orientation
              # geographique dans ce produit local Meteo-France.
              fig6,axes6=plt.subplots(2,2,figsize=(15,14),dpi=115)
              variants=[
                  ('Lignes adjacentes / sans retournement',arr),
                  ('Colonnes adjacentes / sans retournement',canonical),
                  ('Lignes adjacentes / retournement 180',arr[::-1,::-1]),
                  ('Colonnes adjacentes / retournement 180',canonical[::-1,::-1]),
              ]
              coast_features=[]
              for label,url,color,width in layers:
                  try:
                      features=json.loads(get(url)).get('features',[])
                      coast_features.append((features,color,width))
                  except Exception as exc:
                      print('AVERTISSEMENT fond de carte variantes:',label,str(exc)[:120],flush=True)
              for ax,(name,values) in zip(axes6.flat,variants):
                  ax.set_facecolor('#edf2f5')
                  pixels=np.ma.masked_where(~(np.isfinite(values)&(values>=0)&(values<=70)),values)
                  ax.imshow(pixels,extent=[x0,x0+nx*dx,y0-ny*dy,y0],
                            origin='upper',cmap=cmap,vmin=0,vmax=55,
                            interpolation='nearest',alpha=.85,zorder=2)
                  ax3=ax
                  for features,color,width in coast_features:
                      for feature in features:
                          geom=feature.get('geometry') or {}
                          draw_geometry(geom.get('coordinates',[]),geom.get('type'),forward,color,width)
                  for city,(lon,lat) in cities.items():
                      cx,cy=forward.transform(lon,lat)
                      ax.plot(cx,cy,'ko',markersize=2.5,zorder=5)
                      ax.text(cx+8000,cy+8000,city,fontsize=8,
                              path_effects=[pe.withStroke(linewidth=2,foreground='white')])
                  ax.set_xlim(-550000,650000)
                  ax.set_ylim(-250000,850000)
                  ax.set_aspect('equal')
                  ax.grid(alpha=.15)
                  ax.set_title(name,fontsize=11)
              ax3=old_ax3
              # Extraire des noyaux de reflectivite pour comparaison objective
              # avec une observation de reference horodatee. Les centres
              # ci-dessous sont HYPOTHETIQUES, jamais des positions validees.
              from scipy.ndimage import label as connected_label
              from pyproj import Transformer as GeoTransformer
              inverse=GeoTransformer.from_crs(crs,'EPSG:4326',always_xy=True)
              echo_features=[]
              for name,values in variants:
                  mask=np.isfinite(values)&(values>=20)&(values<=70)
                  components,ncomponents=connected_label(mask)
                  areas=np.bincount(components.ravel())
                  selected=sorted(
                      (i for i in range(1,ncomponents+1) if areas[i]>=25),
                      key=lambda i:int(areas[i]),reverse=True)[:12]
                  print('NOYAUX RADAR',name,'total=',ncomponents,
                        '>=25pixels=',len(selected),flush=True)
                  for rank,i in enumerate(selected,1):
                      yy,xx=np.where(components==i)
                      xc=x0+(float(np.mean(xx))+.5)*dx
                      yc=y0-(float(np.mean(yy))+.5)*dy
                      lon,lat=inverse.transform(xc,yc)
                      feature={
                          'type':'Feature',
                          'geometry':{'type':'Point','coordinates':[round(lon,5),round(lat,5)]},
                          'properties':{
                              'hypothese':name,'rang':rank,
                              'observation_utc':observation_utc,
                              'seuil_dbz':20,'pixels':int(areas[i]),
                              'maximum_dbz':round(float(np.max(values[yy,xx])),2),
                              'georeferencement_valide':False}}
                      echo_features.append(feature)
                      print('NOYAU HYPOTHETIQUE',name,rank,
                            'lat/lon=',round(lat,4),round(lon,4),
                            'pixels=',int(areas[i]),flush=True)
              (work/'noyaux-radar-hypotheses.geojson').write_text(
                  json.dumps({'type':'FeatureCollection',
                              'features':echo_features},ensure_ascii=False,indent=2),
                  encoding='utf-8')
              print('NOYAUX GEOJSON:',len(echo_features),'positions candidates',
                    flush=True)
              # Candidat explicite : pas de decalage manuel, pas de retournement.
              # Il reste NON VALIDE jusqu'a comparaison geographique quantitative.
              candidate=arr
              candidate_mask=np.ma.masked_where(
                  ~(np.isfinite(candidate)&(candidate>=0)&(candidate<=70)),
                  candidate)
              fig_candidate,ax_candidate=plt.subplots(figsize=(11,10),dpi=135)
              ax_candidate.set_facecolor('#edf2f5')
              ax_candidate.imshow(candidate_mask,
                  extent=[x0,x0+nx*dx,y0-ny*dy,y0],
                  origin='upper',cmap=cmap,vmin=0,vmax=55,
                  interpolation='nearest',alpha=.84,zorder=2)
              ax3=ax_candidate
              for features,color,width in coast_features:
                  for feature in features:
                      geom=feature.get('geometry') or {}
                      draw_geometry(geom.get('coordinates',[]),geom.get('type'),
                                    forward,color,width)
              for city,(lon,lat) in cities.items():
                  px,py=forward.transform(lon,lat)
                  ax_candidate.plot(px,py,'ko',markersize=2.5,zorder=5)
                  ax_candidate.text(px+7000,py+7000,city,fontsize=8,
                                    path_effects=[pe.withStroke(
                                        linewidth=2,foreground='white')])
              ax3=old_ax3
              ax_candidate.set_xlim(-550000,650000)
              ax_candidate.set_ylim(-250000,850000)
              ax_candidate.set_aspect('equal')
              ax_candidate.set_title(
                  'Radar candidat : lignes sans retournement — NON VALIDE',
                  fontsize=12)
              fig_candidate.text(.5,.015,
                  'Observation UTC : '+str(observation_utc)+
                  ' | Comparaison independante requise',
                  ha='center',fontsize=9,color='#b91c1c')
              fig_candidate.tight_layout(rect=[0,.04,1,1])
              fig_candidate.savefig(work/'radar-candidat-sans-decalage.png')
              # Copie horodatee pour la future animation : fichier diagnostic,
              # pas une autorisation de diffusion.
              if observation_utc:
                  from datetime import datetime as _dt
                  stamp=_dt.fromisoformat(observation_utc).strftime('%Y-%m-%dT%H-%M-%SZ')
                  fig_candidate.savefig(work/('radar-candidat-'+stamp+'.png'))
                  print('IMAGE RADAR HORODATEE:',stamp,flush=True)
              (work/'radar-candidat-georeferencement.json').write_text(
                  json.dumps({
                      'observation_utc':observation_utc,
                      'orientation_candidate':'lignes_adjacentes_sans_retournement',
                      'projection_proj4':crs.to_proj4(),
                      'origine_x_m':x0,'origine_y_m':y0,
                      'pas_x_m':dx,'pas_y_m':dy,
                      'largeur_pixels':nx,'hauteur_pixels':ny,
                      'retournement':False,'transposition':False,
                      'decalage_manuel_x_m':0,'decalage_manuel_y_m':0,
                      'validation_externe':'PROVISOIRE',
                      'diffusion_discord_autorisee':False
                  },indent=2,ensure_ascii=False),encoding='utf-8')
              print('RADAR CANDIDAT: sans decalage, diffusion interdite avant validation',
                    flush=True)
              # Quatre hypotheses sur la MEME zone de Bourth. Aucune
              # correction arbitraire ni recalage par simple ressemblance.
              fig7,axes7=plt.subplots(2,2,figsize=(14,13),dpi=125)
              local_stats={}
              for ax,(name,values) in zip(axes7.flat,variants):
                  ax.set_facecolor('#edf2f5')
                  pixels=np.ma.masked_where(~(np.isfinite(values)&(values>=0)&(values<=70)),values)
                  ax.imshow(pixels,extent=[x0,x0+nx*dx,y0-ny*dy,y0],
                            origin='upper',cmap=cmap,vmin=0,vmax=55,
                            interpolation='nearest',alpha=.82,zorder=2)
                  ax3=ax
                  for features,color,width in coast_features:
                      for feature in features:
                          geom=feature.get('geometry') or {}
                          draw_geometry(geom.get('coordinates',[]),geom.get('type'),forward,color,width)
                  for city,(lon,lat) in cities.items():
                      cx,cy=forward.transform(lon,lat)
                      if abs(cx-bx)<160000 and abs(cy-by)<160000:
                          ax.plot(cx,cy,'ko',markersize=3,zorder=5)
                          ax.text(cx+5000,cy+5000,city,fontsize=8,
                                  path_effects=[pe.withStroke(linewidth=2,foreground='white')])
                  ax.plot(bx,by,'*',color='#e22653',markersize=14,zorder=6)
                  ax.set_xlim(bx-150000,bx+150000)
                  ax.set_ylim(by-150000,by+150000)
                  ax.set_aspect('equal')
                  ax.grid(alpha=.12)
                  ax.set_title(name,fontsize=10)
                  # Statistique descriptive sur 30 km autour de Bourth.
                  # Ce calcul ne valide PAS le positionnement des echos.
                  ix=np.arange(nx)
                  iy=np.arange(ny)
                  cx=x0+(ix+.5)*dx
                  cy=y0-(iy+.5)*dy
                  xx=(cx>=bx-30000)&(cx<=bx+30000)
                  yy=(cy>=by-30000)&(cy<=by+30000)
                  local=values[np.ix_(yy,xx)]
                  local_stats[name]={
                      'pixels_valides':int(np.count_nonzero(np.isfinite(local)&(local>=0)&(local<=70))),
                      'pixels_avec_echo_10dbz':int(np.count_nonzero(np.isfinite(local)&(local>=10)&(local<=70)))
                  }
              ax3=old_ax3
              # Deux lignes distinctes pour eviter le chevauchement du titre.
              fig7.suptitle('Bourth : 4 hypotheses radar sur frontieres — NON VALIDEES',
                            fontsize=14,y=.995)
              fig7.text(.5,.962,'Capture UTC : '+captured_utc+' | Heure produit : '+str(product_times)[:110],
                        ha='center',va='top',fontsize=8,color='#334155')
              fig7.text(.5,.012,'Ne pas diffuser comme radar geolocalise avant verification independante',
                        ha='center',color='#b91c1c',fontsize=10)
              fig7.tight_layout(rect=[0,.03,1,.925])
              fig7.savefig(work/'diagnostic-quatre-hypotheses-bourth.png')
              audit['hypotheses_pixels_bourth_30km']=local_stats
              (work/'audit-georeferencement.json').write_text(
                  json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
              print('HYPOTHESES BOURTH:',local_stats,flush=True)
              print('COMPARAISON BOURTH GENEREE:',work/'diagnostic-quatre-hypotheses-bourth.png',flush=True)
              fig6.suptitle('Mosaïque radar / France : 4 ordres de pixels sur emprise NW — NON VALIDES',
                            fontsize=14)
              fig6.tight_layout()
              fig6.savefig(work/'diagnostic-quatre-ordres-pixels-fond-carte.png')
              print('COMPARAISON PIXELS/FOND GENEREE :',
                    work/'diagnostic-quatre-ordres-pixels-fond-carte.png',flush=True)
              ax3.plot(bx,by,'*',color='#d5274d',markersize=15,zorder=6)
              ax3.set_xlim(bx-150000,bx+150000)
              ax3.set_ylim(by-150000,by+150000)
              ax3.set_aspect('equal')
              ax3.set_title('Bourth — fond de carte et limites administratives (radar a caler)')
              ax3.set_xlabel('Projection Lambert — metres')
              ax3.grid(alpha=.15)
              fig3.tight_layout()
              fig3.savefig(work/'carte-bourth-frontieres-departements.png')
              print('CARTE BOURTH GENEREE:',work/'carte-bourth-frontieres-departements.png',flush=True)

              print('CARTE GENEREE:',work/'premiere-reflectivite.png',flush=True)
              break
          else:raise RuntimeError('Champ Horizontal reflectivity absent')
          PY
