name: KFS map memory regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kfs-map-memory-test.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Verify local map restoration
        run: |
          cat > test.cjs <<'EOF'
          const {chromium,devices}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          try{
          const c=await b.newContext({...devices['iPhone 13'],browserName:undefined,defaultBrowserType:undefined,serviceWorkers:'block'});
          await c.addInitScript(()=>{if(!sessionStorage.getItem('kfs-test-initialized')){localStorage.setItem('kfs-local-context-v1',JSON.stringify({mode:'manual',localMaps:true,city:{name:'Bourth',code:'27108',department:'27'}}));sessionStorage.setItem('kfs-test-initialized','1')}});
          const p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(e.message));
          async function load(hash){await p.goto('https://kfs-meteo.fr/'+hash,{waitUntil:'domcontentloaded',timeout:60000});await p.reload({waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>window.kfsLocalContext?.city&&window.kfsMapMemory,{timeout:30000});}
          const snapshot=()=>p.evaluate(()=>({city:window.kfsLocalContext.city?.name,live:[presentKind,presentId],short:[shortSummaryDept,kfsInlineForecastScope,kfsSnowScope],record:recordZoom,clim:window.kfsLocalContext.climDept,proba:document.getElementById('pzone').value}));
          await load('#france');let first=await snapshot();console.log('DEFAULT',JSON.stringify(first),errors);assert.equal(first.live[1],'27');assert.equal(first.short[0],'27');assert.equal(first.record.id,'27');assert.equal(first.clim,'27');
          await p.evaluate(()=>{window.kfsMapMemory.put('live','dept','76');window.kfsMapMemory.put('short','dept','61');window.kfsMapMemory.put('record','fr','');window.kfsMapMemory.put('clim-map','dept','14');});
          await load('#observations');const restored=await snapshot();console.log('RESTORED',JSON.stringify(restored),errors);assert.equal(restored.live[1],'76');assert.equal(restored.short[0],'61');assert.equal(restored.short[1].scope,'61');assert.equal(restored.short[2].id,'61');assert.equal(restored.record.kind,'fr');assert.equal(restored.clim,'14');assert.equal(restored.city,'Bourth');
          await p.evaluate(()=>window.kfsMapMemory.put('live','free','',[100,100,200,201.37]));await load('#observations');const free=await p.evaluate(()=>({kind:presentKind,box:presentFreeBox}));console.log('FREE',JSON.stringify(free),errors);assert.equal(free.kind,'free');assert.deepEqual(free.box,[100,100,200,201.37]);
          assert.equal(errors.filter(s=>/kfsMapMemory|applyMaps|recordZoom|presentKind|shortSummaryDept|Unexpected token/.test(s)).length,0);
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node test.cjs
