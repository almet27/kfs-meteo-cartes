name: KFS PIAF mobile browser test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/piaf-browser-test.yml']
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Verify PIAF slider on mobile
        run: |
          cat > test.cjs <<'EOF'
          const {chromium,devices}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          try{
            const c=await b.newContext({...devices['iPhone 13'],browserName:undefined,defaultBrowserType:undefined,serviceWorkers:'block'});
            const p=await c.newPage(),errors=[],reqs=[];
            p.on('pageerror',e=>errors.push(e.message));p.on('request',r=>{if(r.url().includes('/api/piaf/'))reqs.push(r.url())});
            await p.goto('https://kfs-meteo.fr/#observations',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>typeof hourlyTarget==='function'&&!!document.getElementById('kfs-piaf-range'),null,{timeout:30000});
            await p.evaluate(()=>{const $=id=>document.getElementById(id);$('obs-layer').value='temp';$('obs-hour-model').value='blend';$('obs-snow-only-toggle').checked=false;$('obs-rain-overlay-toggle').checked=true;$('kfs-piaf-auto').checked=true;$('kfs-piaf-panel').open=true;$('kfs-piaf-auto').dispatchEvent(new Event('change',{bubbles:true}));});
            await p.waitForFunction(()=>{const r=document.getElementById('kfs-piaf-range');return !r.disabled&&Number(r.max)>=1},null,{timeout:45000});
            console.log('READY',await p.locator('#kfs-piaf-selection').textContent());
            async function select(i){
              const start=Date.now();await p.evaluate(i=>{const r=document.getElementById('kfs-piaf-range');r.value=String(i);r.dispatchEvent(new Event('input',{bubbles:true}));r.dispatchEvent(new Event('change',{bubbles:true}));},i);
              await p.waitForFunction(i=>{const r=document.getElementById('kfs-piaf-range'),svg=document.querySelector('#kfs-piaf-fast-map svg'),img=svg?.querySelector('.kfs-piaf-overlay');return Number(r.value)===i&&img?.getAttribute('href')?.startsWith('blob:')&&document.querySelector('#obs-stations-view').dataset.kfsPiafFast==='1'},i,{timeout:15000});
              return Date.now()-start;
            }
            const a=await select(0),first=await p.locator('#kfs-piaf-fast-map .kfs-piaf-overlay').getAttribute('href');
            const t=Date.now();await p.evaluate(()=>{const r=document.getElementById('kfs-piaf-range');r.value='1';r.dispatchEvent(new Event('input',{bubbles:true}));r.dispatchEvent(new Event('change',{bubbles:true}));});
            await p.waitForFunction(first=>document.querySelector('#kfs-piaf-fast-map .kfs-piaf-overlay')?.getAttribute('href')!==first&&!!document.querySelector('#kfs-piaf-fast-map .kfs-piaf-overlay'),first,{timeout:15000});
            const second=Date.now()-t;
            console.log('TIMING first_ms',a,'next_ms',second,'requests',JSON.stringify(reqs),'errors',JSON.stringify(errors));
            assert.equal(reqs.filter(x=>/map-\d/.test(x)).length,0);
            assert.equal(errors.filter(e=>/kfsPiaf|fastMap|Unexpected token|is not defined/.test(e)).length,0);
            assert.ok(second<2500,'Local frame switch slower than 2.5 seconds');
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node test.cjs
