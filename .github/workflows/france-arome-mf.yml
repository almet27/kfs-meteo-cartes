name: KFS France - ARÔME quotidien direct Météo-France
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_arome_mf_daily.py
      - .github/workflows/france-arome-mf.yml
  schedule:
    - cron: '22,52 * * * *'
permissions:
  contents: write
concurrency:
  group: kfs-france-risques-48h
  cancel-in-progress: false
jobs:
  arome:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchroniser le catalogue régional
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Installer les outils GRIB et cartographiques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.8' 'cartopy>=0.23' eccodes
      - name: Vérifier la syntaxe
        run: python -m py_compile scripts/generate_arome_mf_daily.py scripts/france_daily.py scripts/kfs_surface_style.py
      - name: Produire les quatre cartes quotidiennes du modèle ARÔME
        env:
          KFS_FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python scripts/generate_arome_mf_daily.py
      - name: Publier uniquement ARÔME et le catalogue préservé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-maps/france/shortterm-daily/latest.json forecast-maps/france/shortterm-daily/daily-arome-*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualiser ARÔME natif Météo-France et préserver ICON-EU'
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
