name: KFS DIAGRAMME - GEFS NOAA direct backup
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_diagramme_gefs_backup.py
      - .github/workflows/kfs-diagramme-gefs-backup.yml
  schedule:
    # Run 00Z and 12Z, after final lead times are normally available
    - cron: '45 11,23 * * *'
permissions:
  contents: write
concurrency:
  group: kfs-diagramme-gefs-direct
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-proba.txt
      - name: Install ecCodes and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-data
          python -m pip install -r scripts/requirements-ecmwf-proba.txt
      - name: Syntax validation
        run: python -m py_compile scripts/build_diagramme_gefs_backup.py
      - name: Collect genuine NOAA GEFS members and calculate percentiles
        run: python scripts/build_diagramme_gefs_backup.py
      - name: Publish valid NOAA GEFS backup only
        run: |
          git config user.name "KFS METEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagramme/gefs-noaa-8m.json
          if git diff --cached --quiet; then
            echo "No changes to backup"
            exit 0
          fi
          git commit -m "KFS: actualiser diagramme GEFS NOAA direct"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
