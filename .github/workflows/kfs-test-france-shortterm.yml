name: KFS - tester les champs ARÔME et ICON pour /france
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kfs-test-france-shortterm.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Interroger les vrais champs des modèles à Évreux
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen
          base="https://api.open-meteo.com/v1/forecast"
          common=["temperature_2m","wet_bulb_temperature_2m","cape","snowfall",
            "precipitation","wind_speed_850hPa","wind_direction_850hPa",
            "wind_speed_500hPa","wind_direction_500hPa","wind_gusts_10m"]
          optional={
            "meteofrance_arome_france":[],
            "icon_eu":["showers","snow_depth","soil_temperature_0cm","snowfall_height"]
          }
          for model in optional:
            variables=common+optional[model]
            opts={"latitude":49.02,"longitude":1.15,"hourly":",".join(variables),
                "models":model,"forecast_hours":48,"timezone":"UTC"}
            url=base+"?"+urlencode(opts)
            try:
              with urlopen(Request(url,headers={"User-Agent":"KFS-Meteo-Research/1.0"}),timeout=40) as r:
                j=json.load(r)
              print(model, "fields", list(j.get("hourly",{})), "times",
                    len(j.get("hourly",{}).get("time",[])), "elevation",j.get("elevation"))
              for v in variables:
                values=j.get("hourly",{}).get(v,[])
                print(" ",v, "nonnull",sum(x is not None for x in values), "first",values[:2])
              if not j.get("hourly",{}).get("time"):
                raise RuntimeError("No forecast returned")
            except Exception as e:
              print("MODEL_ERROR",model,str(e)[:500])
              raise
          PY
      - name: Vérifier la date exacte de chaque run Open-Meteo
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          roots=("https://data.open-meteo.com/data","https://api.open-meteo.com/data")
          models=("meteofrance_arome_france","icon_eu","dwd_icon_eu")
          for model in models:
            for root in roots:
              u=root+"/"+model+"/static/meta.json"
              try:
                with urlopen(Request(u,headers={"User-Agent":"KFS-Meteo/1.0"}),timeout=12) as f:
                  j=json.load(f)
                print("META_OK",model,root,{k:v for k,v in j.items() if "run" in k or "time" in k})
              except Exception as e:
                print("META_ERROR",model,root,str(e)[:135])
          PY
