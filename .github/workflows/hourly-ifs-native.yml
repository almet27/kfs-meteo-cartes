name: KFS - secours Live IFS natif
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_hourly_ifs_native.py
      - .github/workflows/hourly-ifs-native.yml
  schedule:
    - cron: '40 */3 * * *'
permissions:
  contents: write
concurrency:
  group: kfs-hourly-ifs-native
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev
          pip install 'ecmwf-opendata>=0.3' eccodes numpy
      - name: Build verified native forecast
        run: |
          python -m py_compile scripts/build_hourly_ifs_native.py
          python scripts/build_hourly_ifs_native.py
      - name: Publish native fallback separately
        run: |
          set -euo pipefail
          file=forecast-maps/france/hourly-web/ifs-native.json
          test -s "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'KFS Live : actualiser le secours IFS natif'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
