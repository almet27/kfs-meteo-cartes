name: KFS archive quotidienne foudre WGLC
on:
  push:
    paths:
      - .github/workflows/climato-wglc-daily.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: climato-wglc-daily
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger la source scientifique
        run: |
          curl --fail --location --retry 3 --max-time 1500 -o /tmp/wglc.nc 'https://zenodo.org/records/20277101/files/wglc_timeseries_30m_daily.nc?download=1'
          echo '45d5d39387fe4a1748dac51a90f9fa4e  /tmp/wglc.nc' | md5sum -c -
      - name: Extraire les jours par maille en France
        run: |
          python -m pip install --quiet xarray netCDF4 numpy
          python - <<'PY'
          import xarray as xr, numpy as np, json, calendar
          from pathlib import Path
          ds=xr.open_dataset('/tmp/wglc.nc')
          a=ds['density']
          lat=next(x for x in a.dims if x.lower() in ('lat','latitude'))
          lon=next(x for x in a.dims if x.lower() in ('lon','longitude'))
          t=next(x for x in a.dims if x.lower()=='time')
          a=a.assign_coords({lon:((a[lon]+180)%360)-180}).sortby(lon)
          a=a.where((a[lat]>=40)&(a[lat]<=53),drop=True).where((a[lon]>=-7)&(a[lon]<=12),drop=True).transpose(t,lat,lon)
          lats=a[lat].values.tolist(); lons=a[lon].values.tolist()
          assert len(lats)>=24 and len(lons)>=34
          out=Path('data/wglc/daily-sectors'); out.mkdir(parents=True,exist_ok=True)
          years=a[t].dt.year.values
          for year in range(2010,2026):
              v=a.isel({t:np.flatnonzero(years==year)})
              expected=366 if calendar.isleap(year) else 365
              if v.sizes[t]!=expected: raise ValueError(f'{year}: {v.sizes[t]} / {expected}')
              dates=v[t].dt.strftime('%Y-%m-%d').values
              if len(set(dates))!=expected: raise ValueError('duplicate dates')
              valid_all=[]; days_all=[]
              for month in range(1,13):
                  m=v.isel({t:np.flatnonzero(v[t].dt.month.values==month)}).values
                  valid=np.isfinite(m)&(m>=0)
                  valid_all.append(valid.sum(axis=0).astype(int).ravel().tolist())
                  days_all.append((valid&(m>0)).sum(axis=0).astype(int).ravel().tolist())
              result={'version':1,'year':year,'lat':lats,'lon':lons,'valid':valid_all,'days':days_all,'resolution_deg':0.5,'source':'WWLLN WGLC 2026, Jed O. Kaplan, CC BY-SA 4.0, DOI 10.5281/zenodo.20277101','day':'UTC','method':'one day with positive lightning stroke density in the grid cell'}
              (out/f'{year}.json').write_text(json.dumps(result,separators=(',',':'),allow_nan=False)+'\n')
              print(year,len(lats),len(lons),expected,flush=True)
          PY
      - name: Publier les agrégats France
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wglc/daily-sectors
          git diff --cached --quiet && exit 0
          git commit -m 'Publish WGLC daily lightning sector counts 2010-2025'
          git pull --rebase
          git push
