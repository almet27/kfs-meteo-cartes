name: KFS HARMONIE native source qualification
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kfs-harmonie-native-probe.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests eccodes numpy
      - name: Inspect official DMI DINI GRIB and France coverage
        run: |
          python - <<'PY'
          import requests,datetime as dt,json,tempfile,numpy as np
          from eccodes import codes_grib_new_from_file,codes_get,codes_get_array,codes_release
          from urllib.parse import urlparse
          api='https://opendataapi.dmi.dk/v1/forecastdata/collections/harmonie_dini_sf/items'
          status=requests.get('https://kfs-meteo.fr/api/arome-pi/status.json',timeout=30);print('AROME PI',status.status_code,status.text[:5000],flush=True)
          now=dt.datetime.now(dt.timezone.utc)
          anchor=now.replace(hour=now.hour//3*3,minute=0,second=0,microsecond=0)
          selection=None
          for lag in range(1,5):
              run=anchor-dt.timedelta(hours=lag*3)
              r=requests.get(api,params={'modelRun':run.strftime('%Y-%m-%dT%H:%M:%SZ'),'limit':100},timeout=35)
              print('CATALOG',run.isoformat(),r.status_code,flush=True)
              r.raise_for_status()
              features=r.json().get('features',[])
              usable=[f for f in features if 3<= (dt.datetime.fromisoformat(f['properties']['datetime'])-run).total_seconds()/3600 <= 60]
              if usable and len(features)>=40:
                  selection=run,min(usable,key=lambda f:abs((dt.datetime.fromisoformat(f['properties']['datetime'])-now).total_seconds()-6*3600));break
          assert selection,'No complete operational DINI run'
          run,f=selection;assets=f.get('assets',f.get('asset',{}));url=assets['data']['href']
          u=urlparse(url);print('ASSET HOST',u.hostname,'PATH',u.path,flush=True)
          assert u.scheme=='https' and ((u.hostname in ('opendataapi.dmi.dk','dmigw.govcloud.dk') and u.path.startswith('/v1/forecastdata/download/')) or (u.hostname=='dmi-opendata.s3.eu-north-1.amazonaws.com' and u.path.startswith('/forecastdata/HARMONIE_DINI_SF/'))), 'Unexpected asset URL'
          if u.hostname=='dmigw.govcloud.dk':url='https://opendataapi.dmi.dk'+u.path
          print('SELECTED',f['id'],f['bbox'],f['properties'],flush=True)
          report={'source':'DMI HARMONIE DINI native','run':run.isoformat(),'valid':f['properties']['datetime'],'bbox':f['bbox'],'fields':[]}
          with tempfile.TemporaryFile() as stream:
              index=requests.get(url+'.index',timeout=30);index.raise_for_status()
              lines=[x.split(':') for x in index.text.splitlines() if x.strip()]
              print('INDEX',index.text[:18000],flush=True)
              offsets=[int(x[1]) for x in lines];assert offsets==sorted(set(offsets))
              chosen=[i for i,x in enumerate(lines) if i+1<len(lines) and (x[3] in ('TPRATE','TSPRATE','APCP','TP','WEASD','REFC','REFD','ASNOW') or x[3]=='TMP' and x[4]=='2 m above ground')]
              if not chosen:chosen=[0]
              size=0
              for i in chosen:
                  start,end=offsets[i],offsets[i+1]-1
                  assert 0<end-start<40_000_000
                  with requests.get(url,headers={'Range':f'bytes={start}-{end}'},stream=True,timeout=(15,90)) as r:
                      assert r.status_code==206 and r.headers.get('Content-Range','').startswith(f'bytes {start}-{end}/')
                      data=r.content;assert len(data)==end-start+1 and data[:4]==b'GRIB' and data[-4:]==b'7777'
                      stream.write(data);size+=len(data)
              print('GRIB BYTES',size,flush=True);stream.seek(0)
              def key(g,k):
                  try:return codes_get(g,k)
                  except Exception:return None
              geometry=None
              while (g:=codes_grib_new_from_file(stream)) is not None:
                  try:
                      a={k:key(g,k) for k in ['edition','centre','table2Version','indicatorOfParameter','discipline','parameterCategory','parameterNumber','shortName','name','units','typeOfLevel','level','stepType','startStep','endStep','dataDate','dataTime','validityDate','validityTime','gridType','Ni','Nj']}
                      report['fields'].append(a);print('FIELD',json.dumps(a),flush=True)
                      if geometry is None:
                          lat=codes_get_array(g,'latitudes');lon=(codes_get_array(g,'longitudes')+180)%360-180
                          geometry={'points':len(lat),'lat_min':float(lat.min()),'lat_max':float(lat.max()),'lon_min':float(lon.min()),'lon_max':float(lon.max()),'france_cells':int(((lat>=41)&(lat<=51.5)&(lon>=-6)&(lon<=10.5)).sum())}
                          report['geometry']=geometry;print('GEOMETRY',geometry,flush=True)
                  finally:codes_release(g)
          assert report['fields'] and report['geometry']['france_cells']>1000,'No France coverage'
          open('harmonie-source-report.json','w').write(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: harmonie-source-report
          path: harmonie-source-report.json
