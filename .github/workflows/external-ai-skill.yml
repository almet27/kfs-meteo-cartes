name: KFS comparaison modèles IA NOAA
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mois YYYY-MM (défaut: mois précédent)"
        type: string
        required: false
  push:
    paths:
      - scripts/build_external_ai_skill.py
      - .github/workflows/external-ai-skill.yml
  schedule:
    - cron: '20 9 * * 2'
permissions:
  contents: write
concurrency:
  group: kfs-model-skill
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy xarray h5netcdf h5py 'fsspec[http]'
      - name: Calculer les scores appariés
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          python -m py_compile scripts/build_external_ai_skill.py
          month="$REQUESTED_MONTH"
          if [ -z "$month" ]; then month=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m); fi
          [[ "$month" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]
          python scripts/build_external_ai_skill.py --month "$month"
      - name: Publier les scores vérifiés
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model-skill/*-ai.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scores NOAA/CIRA appariés aux modèles KFS"
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || exit 1
          done
          exit 1
