name: Archives climato France
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Année à générer (1950 à aujourd'hui)"
        required: true
        type: string
  schedule:
    - cron: '35 5 3 * *'
    - cron: '35 4 * * 0'
  push:
    paths:
      - .github/workflows/climato-archive.yml
      - scripts/climato_zones.py
      - scripts/build_climato_archive.py
permissions:
  contents: write
concurrency:
  group: climato-archive
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.pick.outputs.years }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          REQUESTED: ${{ inputs.year }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          y=datetime.date.today().year
          req=os.environ.get("REQUESTED","")
          if req:
              if not req.isdigit() or not 1950<=int(req)<=y:raise SystemExit("Invalid year")
              years=[int(req)]
          elif os.environ.get("SCHEDULE")=="35 4 * * 0":
              years=[i for i in range(y-2,1949,-1) if not Path(f"climato/archive/{i}/annee/latest.json").exists()][:1]
          else:years=[y,y-1]
          print(years)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("years="+json.dumps(years)+"\n")
          PY
  archive:
    needs: select
    if: needs.select.outputs.years != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: ${{ fromJSON(needs.select.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib requests pyproj rasterio
      - name: Build archives
        env:
          YEAR: ${{ matrix.year }}
        run: python scripts/build_climato_archive.py "$YEAR"
      - name: Prioritize January snow archive with regional zooms
        if: github.event_name == 'push'
        env:
          YEAR: ${{ matrix.year }}
        run: |
          if [ "$YEAR" = "$(date +%Y)" ] && [ -f "climato/archive/$YEAR/01/latest.json" ]; then
            python scripts/build_climato_snow.py --year "$YEAR" --month 1 || echo "::warning::January SIM/IMS snow generation failed; anomaly archives remain publishable"
          fi
      - name: Publish only the generated year
        env:
          YEAR: ${{ matrix.year }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="climato/archive/$YEAR"
          test -d "$dir" || exit 0
          backup="$(mktemp -d)"
          cp -a "$dir/." "$backup/"
          for i in $(seq 1 8); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$dir"
            cp -a "$backup/." "$dir/"
            git add "$dir"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publier archives climato France $YEAR"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
