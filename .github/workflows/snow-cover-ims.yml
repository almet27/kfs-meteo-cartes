name: KFS neige au sol observée — NOAA IMS
on:
  push:
    paths:
      - scripts/build_snow_cover_ims.py
      - .github/workflows/snow-cover-ims.yml
  workflow_dispatch:
  schedule:
    - cron: '20 5,17 * * *'
permissions:
  contents: write
concurrency:
  group: kfs-snow-cover-ims
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy requests rasterio Pillow
      - run: python scripts/build_snow_cover_ims.py
      - name: Publish verified snow image and source date
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snow-cover
          git diff --cached --quiet && exit 0
          git commit -m 'Update NOAA IMS ground snow analysis'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
