name: KFS - test cache météo et accès direct DWD ICON EU
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_dwd_icon_eu.py
      - scripts/test_kfs_weather_cache.py
      - scripts/kfs_weather_cache.py
      - .github/workflows/kfs-direct-weather-pilot.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test du cache et de la protection 429
        run: python scripts/test_kfs_weather_cache.py
      - name: Vérification syntaxique des générateurs
        run: python -m py_compile scripts/kfs_weather_cache.py scripts/generate_france_shortterm_risks.py scripts/ifs_early9km.py scripts/generate_france_extended_daily.py scripts/kfs_surface_style.py scripts/probe_dwd_icon_eu.py
      - name: Installer le décodeur GRIB
        run: python -m pip install eccodes
      - name: Vérifier les quatre champs ICON EU directement au DWD
        run: python scripts/probe_dwd_icon_eu.py
      - name: Archiver le diagnostic
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-icon-eu-pilot
          path: dwd-icon-eu-pilot.json
          retention-days: 7
