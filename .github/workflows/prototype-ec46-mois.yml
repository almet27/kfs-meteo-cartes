name: PROTOTYPE cartes EC46 J+30 (sans production)

on:
  workflow_dispatch:
  push:
    paths:
      - 'meteo-mois/maps_ec46.py'
      - '.github/workflows/prototype-ec46-mois.yml'

permissions:
  contents: write

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances cartes
        run: python -m pip install --disable-pip-version-check numpy matplotlib cartopy
      - name: Vérifier le programme
        run: python -m py_compile meteo-mois/maps_ec46.py
      - name: Collecter la grille EC46 et créer les deux cartes
        run: python meteo-mois/maps_ec46.py
      - name: Archiver les cartes sans les publier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec46-cartes-4semaines-TEST
          path: meteo-mois-preview/
          if-no-files-found: warn
          retention-days: 7

      - name: Publier uniquement sur la branche de test (aucun impact GitHub Pages)
        if: github.ref == 'refs/heads/feature/meteo-1mois-atlantique-europe-plan'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f meteo-mois-preview/
          if git diff --cached --quiet; then
            echo "Cartes inchangées"
          else
            git commit -m "preview(ec46): publier les cartes expérimentales géoréférencées"
            git push origin HEAD:refs/heads/feature/meteo-1mois-atlantique-europe-plan
          fi
