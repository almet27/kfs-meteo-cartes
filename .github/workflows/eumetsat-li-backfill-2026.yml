name: KFS foudre EUMETSAT 2026 — collecte quotidienne
on:
  push:
    paths:
      - .github/workflows/eumetsat-li-backfill-2026.yml
      - foudre-li/archive_station.py
      - foudre-li/parallax-lut.npz
  workflow_run:
    workflows: ['Préparer les tables de parallaxe EUMETSAT LI']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 4,16 * * *'
  workflow_dispatch:
    inputs:
      backlog_days:
        description: 'Nombre de jours historiques supplémentaires (0 à 3)'
        default: '1'
        required: true
permissions:
  contents: write
concurrency:
  group: eumetsat-li-station-archive
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Contrôler la présence de la table officielle
        id: lut
        run: |
          if test -s foudre-li/parallax-lut.npz; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Table de parallaxe EUMETSAT manquante : collecte différée, aucun zéro publié.'
          fi
      - uses: actions/setup-python@v5
        if: steps.lut.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - if: steps.lut.outputs.ready == 'true'
        run: python -m pip install -r foudre-li/requirements.txt scipy
      - name: Collecter la veille et rattraper les jours manquants
        if: steps.lut.outputs.ready == 'true'
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          BACKLOG: ${{ inputs.backlog_days || '2' }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, json
          from pathlib import Path
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'foudre-li')
          from parallax import Parallax,LUT,METHOD
          Parallax(LUT)
          n=int(os.environ['BACKLOG'])
          if not 0<=n<=3: raise ValueError('backlog_days doit être compris entre 0 et 3')
          end=datetime.now(ZoneInfo('Europe/Paris')).date()-timedelta(days=1)
          start=date(2026,1,1)
          base=Path('data/eumetsat-li/daily')
          def complete(day):
              p=base/(day.isoformat()+'.json')
              if not p.exists(): return False
              try:
                  d=json.loads(p.read_text())
                  return d.get('complete') is True and d.get('pilot') is False and d.get('parallax')==METHOD and d.get('date')==day.isoformat()
              except Exception: return False
          missing=[end-timedelta(days=i) for i in range((end-start).days+1) if not complete(end-timedelta(days=i))]
          partial=Path('data/eumetsat-li/partial')
          partial.mkdir(parents=True,exist_ok=True)
          def usable(day):
              try:
                  d=json.loads((partial/(day.isoformat()+'.json')).read_text())
                  return d.get('complete') is False and d.get('pilot') is False and d.get('parallax')==METHOD and d.get('date')==day.isoformat() and .99<=d.get('coverage_fraction',0)<=1 and 0<=d.get('max_gap_seconds',9999)<=900
              except Exception: return False
          progress=Path('data/eumetsat-li/progress')
          older=[d for d in missing if d!=end and not usable(d)]
          # Priorité juin, puis saison orageuse, puis reste de l'année.
          # Rotation par créneau absolu : une date défaillante ne bloque pas les autres.
          june=sorted(d for d in older if d.month==6)
          season=sorted(d for d in older if 4<=d.month<=9 and d.month!=6)
          rest=sorted(d for d in older if d not in june and d not in season)
          slot=int(datetime.now(ZoneInfo('Europe/Paris')).timestamp()//43200)
          pool=june or season or rest
          if pool:
              # Alterner régulièrement vers les autres périodes même si juin reste incomplet.
              if slot%4==0 and (season or rest): pool=season or rest
              elif slot%8==1 and rest: pool=rest
              offset=(slot*max(1,n))%len(pool)
              chosen=(pool[offset:]+pool[:offset])[:n]
          else: chosen=[]
          if os.environ['EVENT']=='push':
              retry=[date(2026,6,5),date(2026,6,6)]
              retry=[d for d in retry if not complete(d) and not usable(d)]
              chosen=(retry+[d for d in chosen if d not in retry])[:n]
          # Resume June dates already started before selecting more new days.
          resumable=sorted(d for d in older if d.month==6 and (progress/(d.isoformat()+'.json')).exists())
          if n and resumable:
              chosen=(resumable+[d for d in chosen if d not in resumable])[:n]
          targets=([end] if end in missing and not usable(end) else [])+chosen
          for day in targets:
              p=base/(day.isoformat()+'.json')
              print('COLLECTE',day,flush=True)
              try:
                  subprocess.run([sys.executable,'foudre-li/archive_station.py','--date',day.isoformat()],check=True,timeout=720)
              except (subprocess.CalledProcessError,subprocess.TimeoutExpired):
                  if p.exists() and not complete(day):
                      try:
                          d=json.loads(p.read_text())
                          if d.get('complete') is False and d.get('pilot') is False and d.get('date')==day.isoformat() and d.get('parallax')==METHOD and d.get('radius_km')==15 and .99<=d.get('coverage_fraction',0)<=1 and 0<=d.get('max_gap_seconds',9999)<=900:
                              p.replace(partial/p.name)
                              print('JOUR PARTIEL CONSERVE POUR CARTES',day,flush=True)
                      finally:
                          if p.exists(): p.unlink()
                  print('JOUR NON COMPLET',day,flush=True)
              if not complete(day) and not usable(day): print('COUVERTURE INSUFFISANTE',day,flush=True)
          remaining=sum(not complete(d) for d in missing)
          validated=sum(complete(d) for d in targets)
          print('Jours manquants restants',remaining,flush=True)
          print('Jours validés sur les dates traitées',validated,'/',len(targets),flush=True)
          if validated<len(targets): print('::warning::Collecte incomplète : les produits validés sont conservés pour reprise, aucune journée incomplète présentée comme complète.',flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'### Archives foudre 2026\n\nJours validés parmi les dates traitées : {validated}/{len(targets)}.\n\nJours restant à valider : {remaining}.\n')
          PY
      - name: Publier les journées complètes et cartes partielles documentées
        if: steps.lut.outputs.ready == 'true'
        run: |
          python foudre-li/aggregate_station_days.py
          if ! test -d data/eumetsat-li/daily; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/eumetsat-li/daily data/eumetsat-li/monthly data/eumetsat-li/yearly
          if test -d data/eumetsat-li/partial; then git add data/eumetsat-li/partial; fi
          if test -d data/eumetsat-li/progress; then git add -A data/eumetsat-li/progress; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Update validated EUMETSAT station lightning archives'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
