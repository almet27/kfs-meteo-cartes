name: TEST Meteosat satellite et foudre EUMETView (sans production)

on:
  push:
    paths:
      - 'eumetview-li-test/**'
      - '.github/workflows/eumetview-li-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-wms:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Vérifier le code
        run: python -m py_compile eumetview-li-test/probe_eumetview.py
      - name: Tester les deux couches EUMETView WMS
        run: python eumetview-li-test/probe_eumetview.py
      - name: Archiver les images de test sans diffusion Discord
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-li-wms-preview
          path: mtg-li-preview/
          if-no-files-found: warn
          retention-days: 7
