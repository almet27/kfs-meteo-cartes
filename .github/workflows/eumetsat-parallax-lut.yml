name: Préparer les tables de parallaxe EUMETSAT LI
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Lien HTTPS direct officiel EUMETSAT vers SSP_0_LUT.tar.gz"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: kfs-parallax-lut
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Télécharger les tables officielles
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u=urlparse(os.environ["ARCHIVE_URL"])
          if u.scheme != "https" or u.hostname != "sftp.eumetsat.int" or u.username or u.password:
              raise SystemExit("URL HTTPS officielle sftp.eumetsat.int requise")
          PY
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 1500 --max-filesize 4000000000 --output /tmp/SSP_0_LUT.tar.gz "$ARCHIVE_URL"
      - name: Construire et contrôler la table régionale
        run: |
          python -m pip install numpy netCDF4 scipy
          python foudre-li/build_parallax_lut.py /tmp/SSP_0_LUT.tar.gz
          test -s foudre-li/parallax-lut.npz
      - name: Publier uniquement la table régionale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f foudre-li/parallax-lut.npz
          if ! git diff --cached --quiet; then
            git commit -m "Ajouter les tables régionales de parallaxe EUMETSAT SSP 0"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
