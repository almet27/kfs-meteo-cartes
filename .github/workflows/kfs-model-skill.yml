name: KFS statistiques mensuelles des modèles

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mois YYYY-MM (vide = mois précédent)"
        required: false
        type: string
  push:
    paths:
      - 'scripts/build_model_skill.py'
      - 'scripts/build_model_regimes.py'
      - '.github/workflows/kfs-model-skill.yml'
  schedule:
    - cron: '35 7 * * 1'

permissions:
  contents: write

concurrency:
  group: kfs-model-skill
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier les prévisions historiques face à ERA5
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            python scripts/build_model_skill.py --month "$REQUESTED_MONTH"
          else
            python scripts/build_model_skill.py
          fi
      - name: Vérifier les configurations synoptiques (indices de pression de surface)
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            python scripts/build_model_regimes.py --month "$REQUESTED_MONTH"
          else
            python scripts/build_model_regimes.py
          fi
      - name: Publier uniquement les statistiques réellement vérifiées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model-skill/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualiser statistiques mensuelles modèles météo"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
