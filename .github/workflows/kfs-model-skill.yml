name: KFS statistiques mensuelles des modèles

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mois YYYY-MM (vide = mois précédent)"
        required: false
        type: string
  push:
    paths:
      - 'scripts/build_model_skill.py'
      - 'scripts/build_model_regimes.py'
      - '.github/workflows/kfs-model-skill.yml'
  schedule:
    - cron: '35 7 * * 1'

permissions:
  contents: write

concurrency:
  group: kfs-model-skill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.months.outputs.months }}
    steps:
      - uses: actions/checkout@v4
      - id: months
        name: Repérer les archives mensuelles manquantes
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import date, datetime, timezone, timedelta
          from pathlib import Path
          requested = os.environ.get("REQUESTED_MONTH", "").strip()
          first = date(2025, 1, 1)
          today = datetime.now(timezone.utc).date()
          previous = today.replace(day=1) - timedelta(days=1)
          last = previous.strftime("%Y-%m")
          if requested:
              if not re.fullmatch(r"20\d\d-(0[1-9]|1[0-2])", requested) or not "2025-01" <= requested <= last:
                  raise SystemExit("Mois hors période disponible")
              months = [requested]
          else:
              months = []
              current = first
              while current.strftime("%Y-%m") <= last:
                  month = current.strftime("%Y-%m")
                  base = Path("data/model-skill")
                  def usable(path, regime=False):
                      try:
                          obj = json.loads(path.read_text())
                          groups = obj["regimes" if regime else "metrics"]
                          valid = obj["period"] == month and bool(obj["run_dates"]) and bool(groups) and all(any(n > 0 for n in item["n"]) for item in groups.values())
                          if not valid or month < "2025-07":
                              return valid
                          # AIFS ENS Control n'existe pas dans les archives avant juillet 2025.
                          has_control = any(
                              any(v is not None for v in (
                                  item.get("index_mae_hpa", {}) if regime else item.get("series", {})
                              ).get("aifs_control", []))
                              for item in groups.values()
                          )
                          if has_control:
                              return True
                          # En cas de source indisponible, pas de boucle de recalcul
                          # à chaque workflow : une nouvelle tentative après sept jours.
                          checked = obj.get("aifs_control_attempted_utc")
                          return bool(checked and (datetime.now(timezone.utc) -
                                      datetime.fromisoformat(checked)).total_seconds() < 7 * 86400)
                      except (OSError, ValueError, KeyError, TypeError):
                          return False
                  if not usable(base / (month + ".json")) or not usable(base / (month + "-regimes.json"), True):
                      months.append(month)
                  current = date(current.year + (current.month == 12), current.month % 12 + 1, 1)
              # Priorité au mois le plus récent puis décembre 2025.
              if "2025-12" in months:
                  months.remove("2025-12")
                  months.insert(0, "2025-12")
              # Revalider le dernier mois complet (ERA5/J+15 parfois tardif).
              if last >= "2026-04":
                  if last in months:
                      months.remove(last)
                  months.insert(0, last)
              # Deux mois maximum par lancement afin de ne pas saturer
              # l'API d'ensembles à 51 membres et les quotas GitHub Actions.
              months = months[:2]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("months=" + json.dumps(months), file=f)
          print("Mois à traiter:", months)
          PY

  verifier:
    needs: plan
    if: needs.plan.outputs.months != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier la syntaxe des calculateurs
        run: python -m py_compile scripts/build_model_skill.py scripts/build_model_regimes.py
      - name: Vérifier les prévisions historiques face à ERA5
        env:
          REQUESTED_MONTH: ${{ matrix.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            python scripts/build_model_skill.py --month "$REQUESTED_MONTH"
          else
            python scripts/build_model_skill.py
          fi
      - name: Vérifier les configurations synoptiques (indices de pression de surface)
        env:
          REQUESTED_MONTH: ${{ matrix.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            python scripts/build_model_regimes.py --month "$REQUESTED_MONTH"
          else
            python scripts/build_model_regimes.py
          fi
      - name: Publier uniquement les statistiques réellement vérifiées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/model-skill/${{ matrix.month }}.json" "data/model-skill/${{ matrix.month }}-regimes.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualiser statistiques mensuelles modèles météo"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
