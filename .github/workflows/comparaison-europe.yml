name: Comparaisons Europe 4 modèles
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Cartes prévisions Europe IFS AIFS'
      - 'Prévisions Europe GFS AIGFS'
    types: [completed]
  push:
    paths:
      - 'scripts/compare_europe_forecasts.py'
      - '.github/workflows/comparaison-europe.yml'
      - 'forecast-maps/europe/metadata.json'
      - 'forecast-maps/europe/noaa-metadata.json'
  schedule:
    - cron: '7,22,37,52 * * * *'
    # Relances prioritaires avant 10 h et 21 h 30 en Europe/Paris (été/hiver).
    - cron: '43 7,8,19,20 * * *'

permissions:
  contents: write

concurrency:
  group: comparaisons-europe
  cancel-in-progress: false

jobs:
  cartes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lire les dernières cartes publiées
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Vérifier si la comparaison est périmée
        id: check
        run: |
          outdated=false
          previous="$(jq -r '.generated_utc // empty' forecast-maps/europe/compare-metadata.json 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            outdated=true
          else
            previous_epoch="$(date -u -d "$previous" +%s)"
            for f in metadata.json noaa-metadata.json; do
              generated="$(jq -r '.generated_utc // empty' "forecast-maps/europe/$f")"
              if [ -n "$generated" ] && [ "$(date -u -d "$generated" +%s)" -gt "$previous_epoch" ]; then
                outdated=true
              fi
            done
          fi
          echo "outdated=$outdated" >> "$GITHUB_OUTPUT"
          echo "Recalcul nécessaire : $outdated"
      - name: Installer Pillow
        if: steps.check.outputs.outdated == 'true'
        run: python -m pip install pillow
      - name: Assembler les quatre modèles
        if: steps.check.outputs.outdated == 'true'
        run: python scripts/compare_europe_forecasts.py
      - name: Publier la comparaison
        if: steps.check.outputs.outdated == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-maps/europe/compare-*.png forecast-maps/europe/compare-metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualiser comparaisons Europe'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/compare_europe_forecasts.py
            git add forecast-maps/europe/compare-*.png forecast-maps/europe/compare-metadata.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Synchroniser comparaisons Europe'
            sleep 3
          done
          exit 1
