name: KFS - cartes publiques des risques
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_public_risks.cjs
      - .github/workflows/public-risks.yml
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
concurrency:
  group: kfs-public-risks
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate validated daily risk maps
        run: |
          node --check scripts/build_public_risks.cjs
          node scripts/build_public_risks.cjs
      - name: Publish maps
        run: |
          git config user.name "KFS METEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add proba/public-risks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KFS: public daily risk maps"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 3
          done
          exit 1
