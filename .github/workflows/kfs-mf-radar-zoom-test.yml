name: KFS official radar HD mobile zoom test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kfs-mf-radar-zoom-test.yml']
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Verify real published HD asset, zoom and low-resolution fallback
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright-core');
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});try{
            const p=await b.newPage({...devices['iPhone 13'],serviceWorkers:'block'}),errors=[],requests=[];
            p.on('pageerror',e=>errors.push(e.message));p.on('request',r=>{if(r.url().includes('/api/mf-radar-hd/'))requests.push(r.url())});
            await p.goto('https://kfs-meteo.fr/#observations',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>typeof kfsRadarHDHref==='function'&&typeof kfsRadarHDLoad==='function',null,{timeout:30000});
            console.log('STATE BEFORE',await p.evaluate(()=>({view:document.getElementById('obs-stations-view')?.hidden,home:document.getElementById('home-live')?.hidden,active:kfsLiveRadarActive(),status:document.getElementById('obs-rain-overlay-status')?.textContent,source:obsRainFrames[0]?.source,error:obsRainError,at:obsRainAt})));const info=await p.evaluate(async()=>{const r=await fetch('/api/mf-radar-hd/manifest.json');if(!r.ok)throw Error('Official publication unavailable');const m=await r.json(),f=m.web_frames.at(-1);const a=await fetch('/api/mf-radar-hd/'+f.file);if(!a.ok)throw Error('Light frame unavailable');const blob=await a.blob();return {frame:{...f,source:'mf'},bytes:blob.size,frames:m.web_frames.length,valid:m.derniere_observation_utc}});
            console.log('PUBLISHED',JSON.stringify(info));
            // Isolate rendering from the live animation, using exactly one actual
            // published observation. No invented frames or timestamps.
            await p.evaluate(async info=>{clearTimeout(obsRainTimer);const r=await fetch('/api/mf-radar-hd/'+info.frame.file),blob=await r.blob();const f={...info.frame,blob,url:URL.createObjectURL(blob)};obsRainFrames=[f];obsRainIndex=0;obsRainAt=f.observation_utc;const svg=document.getElementById('obs-svg'),layer=document.getElementById('obs-rain-overlay');document.getElementById('obs-layer').value='temp';document.getElementById('obs-hour').value='0';document.getElementById('obs-rain-overlay-toggle').checked=true;document.getElementById('obs-snow-only-toggle').checked=false;document.getElementById('obs-stations-view').scrollIntoView();svg.setAttribute('viewBox','0 0 730 735');layer.setAttribute('href',kfsRadarHDHref(f,layer));if(layer.hasAttribute('data-kfs-radar-hd'))throw Error('HD used at national scale');svg.setAttribute('viewBox','100 100 250 250');layer.setAttribute('href',kfsRadarHDHref(f,layer));},info);
            try{await p.waitForFunction(()=>document.getElementById('obs-rain-overlay').hasAttribute('data-kfs-radar-hd'),null,{timeout:20000});}catch(e){console.log('HD DIAGNOSTIC',JSON.stringify(await p.evaluate(()=>({active:kfsRadarHDActive(),live:kfsLiveRadarActive(),zoom:kfsRadarZoomed(document.getElementById('obs-svg')),mode:kfsRadarMode(),at:obsRainAt,source:obsRainFrames[0]?.source,cache:[...kfsRadarHDCache.keys()],retry:[...kfsRadarHDRetry.keys()],pending:kfsRadarHDPending?.file,status:document.getElementById('obs-rain-overlay-status')?.textContent,home:document.getElementById('home-live')?.hidden,view:document.getElementById('obs-stations-view')?.hidden,rect:document.getElementById('obs-stations-view')?.getBoundingClientRect().toJSON()}))),'requests',requests,'errors',errors);throw e;}
            console.log('HD LOADED',requests.filter(x=>x.includes('-2920.png')));
            await p.evaluate(()=>{document.getElementById('obs-svg').setAttribute('viewBox','0 0 730 735');kfsRadarHDRefresh();if(document.getElementById('obs-rain-overlay').hasAttribute('data-kfs-radar-hd'))throw Error('HD not released on zoom out');});
            console.log('PASS zoom in/out, actual HD frame, low-resolution fallback on zoom-out','ERRORS',JSON.stringify(errors));
            if(errors.some(e=>/kfsRadarHD|Unexpected token|is not defined/.test(e)))throw Error('Browser JavaScript error');
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
