name: KFS PROBA - ECMWF ENS open probabilities
on:
  workflow_dispatch:
  schedule:
    # ECMWF 00Z ENS: wait until the open-data files are published
    - cron: '20 11,15 * * *'

permissions:
  contents: write

concurrency:
  group: kfs-ecmwf-probabilities
  cancel-in-progress: false

jobs:
  probabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-proba.txt
      - name: Install ecCodes and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-data
          python -m pip install -r scripts/requirements-ecmwf-proba.txt
      - name: Produce ECMWF ensemble probability grid
        env:
          ECMWF_SOURCE: ecmwf
        run: python scripts/build_ecmwf_probability.py
      - name: Commit data (only on success)
        run: |
          git config user.name "KFS METEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add proba/ecmwf-probabilities.json
          if git diff --cached --quiet; then
            echo "No new ECMWF probability data"
          else
            git commit -m "KFS: actualiser probabilites ECMWF ENS 00Z"
            git push
          fi
