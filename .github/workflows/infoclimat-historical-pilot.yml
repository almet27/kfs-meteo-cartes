name: Pilote historique StatIC
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/infoclimat-historical-pilot.yml
permissions:
  contents: read
concurrency:
  group: infoclimat-historical-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Tester une seule station sur toute sa période disponible
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib, urllib.parse, urllib.request
          base="https://climato.chom.engineering"
          sid="STATIC0253"
          def get(path, params):
              url=base+path+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"KFS-METEO-archive-POC/1.0"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  body=response.read(8_000_001)
              if len(body)>8_000_000: raise ValueError("Response too large")
              obj=json.loads(body)
              if obj.get("tronque") or obj.get("suite"): raise ValueError("Truncated archive")
              if not isinstance(obj.get("mesures"),list): raise ValueError("Invalid response")
              if not all(row.get("ic_id")==sid for row in obj["mesures"]): raise ValueError("Station mismatch")
              if "Etalab" not in str(obj.get("licence")): raise ValueError("Unexpected licence")
              return obj
          records=get("/statIC/records",{"station":sid})
          dates=[dt.date.fromisoformat(row["premiere_obs"]) for row in records["mesures"] if row.get("premiere_obs")]
          if not dates: raise ValueError("No historical coverage")
          first=min(dates)
          today=dt.date.today()
          end=today.replace(day=1)
          monthly=get("/statIC/mensuelle",{"station":sid,"from":str(first.replace(day=1)),"to":str(end)})
          if not monthly["mesures"]: raise ValueError("Empty monthly archive")
          out=pathlib.Path("pilot");out.mkdir()
          (out/"monthly.json").write_text(json.dumps(monthly,ensure_ascii=False))
          (out/"records.json").write_text(json.dumps(records,ensure_ascii=False))
          print("Station",sid,"first observed",first,"monthly rows",len(monthly["mesures"]))
          # This POC is deliberately limited to one station; no network-wide
          # collection without confirmation of service capacity and licences.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: infoclimat-historical-pilot
          path: pilot/
          retention-days: 7
