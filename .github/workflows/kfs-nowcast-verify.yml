name: KFS - vérification du réajustement stations
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/kfs_nowcast_verify.mjs
      - .github/workflows/kfs-nowcast-verify.yml
  schedule:
    - cron: '12,27,42,57 * * * *'
permissions:
  contents: write
concurrency:
  group: kfs-nowcast-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test correction kernel
        run: node scripts/kfs_nowcast_verify.mjs --test
      - name: Retrieve published station observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download stations-live --pattern manifest.json --dir /tmp/kfs-nowcast
      - name: Verify and archive forecasts
        run: node scripts/kfs_nowcast_verify.mjs /tmp/kfs-nowcast/manifest.json
      - name: Publish matched sample counts and errors
        run: |
          git config user.name "KFS METEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add nowcast/pending.json nowcast/skill.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KFS: update prospective nowcast verification"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 3
          done
          exit 1
