name: Assembler GIF radar de diagnostic
on:
  workflow_run:
    workflows: ['Premier decodage radar Meteo-France']
    types: [completed]
  workflow_dispatch:
    inputs:
      ville:
        description: 'Nom de la commune pour le zoom radar'
        required: true
        default: 'Bourth'
        type: string
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
jobs:
  gif-diagnostic:
    outputs:
      atlas_ready: ${{ steps.atlas_check.outputs.ready }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow pyproj numpy matplotlib
      - name: Verifier les scripts et les tests radar
        run: |
          python -m py_compile radar/assembler_gif.py radar/zoom_ville.py radar/atlas_gif.py
          python -m unittest discover -s radar -p 'test_*.py' -v
      - name: Recuperer les dernieres observations radar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p radar-historique radar-sortie
          # Seules les acquisitions recentes peuvent satisfaire le seuil de fraicheur.
          # Eviter 48 telechargements d'artefacts anciens a chaque nouveau cycle.
          cutoff="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list --workflow premier-decodage-radar.yml --status success --limit 24 --json databaseId,createdAt | \
            jq -r --arg cutoff "$cutoff" '.[] | select(.createdAt >= $cutoff) | .databaseId' > radar-runs.txt
          echo "Acquisitions recentes a analyser : $(wc -l < radar-runs.txt)"
          while IFS= read -r run; do
            [ -n "$run" ] || continue
            mkdir -p "radar-temp/$run"
            if gh run download "$run" -n premiere-carte-radar -D "radar-temp/$run"; then
              # Les anciens runs ne contiennent que radar-candidat-sans-decalage.png.
              # Reconstituer le nom a partir de l'horodatage BUFR stocke dans le JSON.
              # Ne jamais utiliser l'heure de lancement GitHub a sa place.
              python - "radar-temp/$run" radar-historique <<'PY'
          import json,re,shutil,sys
          from pathlib import Path
          from datetime import datetime,timezone
          source,target=map(Path,sys.argv[1:])
          files=list(source.rglob('radar-candidat-????-??-??T??-??-??Z.png'))
          if files:
              for p in files:
                  if not (target/p.name).exists():
                      shutil.copy2(p,target/p.name)
              print('Images horodatees existantes :',len(files),flush=True)
          else:
              image=next(iter(source.rglob('radar-candidat-sans-decalage.png')),None)
              stamp=next(iter(source.rglob('horodatage-observation-radar.json')),None)
              if image and stamp:
                  data=json.loads(stamp.read_text())
                  raw=data.get('observation_utc')
                  if raw:
                      when=datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(timezone.utc)
                      name='radar-candidat-'+when.strftime('%Y-%m-%dT%H-%M-%SZ')+'.png'
                      if not (target/name).exists():
                          shutil.copy2(image,target/name)
                      print('Image ancienne horodatee depuis BUFR :',name,flush=True)
                  else:
                      print('Horodatage BUFR absent, image ignoree',flush=True)
              else:
                  print('Image ou JSON observation absent, run ignore',flush=True)
          for grid in source.rglob('radar-grid-????-??-??T??-??-??Z.npz'):
              if not (target/grid.name).exists():
                  shutil.copy2(grid,target/grid.name)
          PY
              echo "Contenu du run $run :"; find "radar-temp/$run" -type f | head -n 8
            else
              echo "AVERTISSEMENT: impossible de telecharger le run $run"
            fi
          done < radar-runs.txt
          echo "Images candidates disponibles :"
          find radar-historique -type f -name '*.png' | sort
      - name: Verifier les declenchements automatiques sur 60 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list --workflow premier-decodage-radar.yml --limit 60 --json event,createdAt,conclusion,databaseId | \
            jq --arg cutoff "$cutoff" '[.[] | select(.createdAt >= $cutoff)]' > radar-sortie/declenchements-radar.json
          echo "Acquisitions programmees / manuelles durant les 60 dernieres minutes :"
          jq -r 'group_by(.event)[] | .[0].event + ": " + (length|tostring)' radar-sortie/declenchements-radar.json
      - name: Construire un GIF seulement si les observations sont continues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,subprocess,sys
          from radar.zoom_ville import radar_grid
          images=sorted(Path('radar-historique').glob('radar-candidat-*.png'))
          pairs=[]
          excluded_old=0
          for p in images:
              stamp=p.stem.removeprefix('radar-candidat-')
              grid=Path('radar-historique')/('radar-grid-'+stamp+'.npz')
              if not grid.is_file():
                  excluded_old+=1
                  continue
              try:
                  observed, values, geo = radar_grid(grid)
              except ValueError as exc:
                  if 'Projection radar non conforme' in str(exc):
                      excluded_old+=1
                      continue
                  raise
              t=datetime.strptime(stamp,'%Y-%m-%dT%H-%M-%SZ')
              if observed.replace(tzinfo=None)!=t:
                  raise RuntimeError(f'Image et grille discordantes : {p.name}')
              pairs.append((t,p))
          print('ANCIENNES CARTES LAMBERT OU SANS GRILLE EXCLUES:',excluded_old,flush=True)
          # AUCUNE image de l'ancien referentiel Lambert n'entre dans l'animation.
          # Diagnostic : accepter exceptionnellement 25 min, avec avertissement visible dans le GIF.
          # Le mode diffusion valide reste limite a 15 min.
          selected=[]
          for t,p in pairs:
              if selected and (t-selected[-1][0]).total_seconds()>1500:
                  selected=[]
              selected.append((t,p))
          selected=selected[-8:]
          # Pas de GIF trompeur a partir de donnees anciennes.
          if selected:
              age=(datetime.now(timezone.utc)-selected[-1][0].replace(tzinfo=timezone.utc)).total_seconds()/60
              if age>45 or age < -5:
                  print(f'DONNEES OBSOLETES : derniere observation agee de {age:.1f} min. GIF non regenere.',flush=True)
                  selected=[]
          Path('radar-sortie/radar-images.json').write_text(
              json.dumps([t.strftime('%Y-%m-%dT%H:%M:%SZ') for t,_ in selected],indent=2),
              encoding='utf-8')
          print('Observations retenues :',len(selected),'sur',len(images),'images horodatees',flush=True)
          for t,p in selected:
              print(' -',t.isoformat(),'UTC',flush=True)
          if len(selected)<2:
              print('AUCUN GIF: moins de deux observations distinctes disponibles. Verifier les fichiers radar-candidat horodates dans les artefacts.',flush=True)
              Path('radar-sortie/diagnostic-assemblage.txt').write_text('Images trouvees : '+str(len(images))+'\\nObservations continues : '+str(len(selected))+'\\n')
              sys.exit(0)
          command=[sys.executable,'radar/assembler_gif.py','--diagnostic',
                   '--intervalle-max-minutes','25',
                   '--sortie','radar-sortie/radar-diagnostic.gif']
          command.extend(str(p) for _,p in selected)
          print('Assemblage de',len(selected),'observations',flush=True)
          subprocess.run(command,check=True)
          PY
      - name: Zoom radar diagnostic sur la commune
        if: hashFiles('radar-sortie/radar-diagnostic.gif') != ''
        continue-on-error: true
        env:
          VILLE: ${{ inputs.ville || 'Bourth' }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys,urllib.parse,urllib.request
          ville=os.environ.get('VILLE','Bourth').strip()
          if not ville or len(ville)>100:
              raise SystemExit('Nom de commune invalide')
          url='https://geo.api.gouv.fr/communes?'+urllib.parse.urlencode(
              {'nom':ville,'fields':'nom,centre','format':'json','geometry':'centre','limit':10})
          with urllib.request.urlopen(url,timeout=20) as r:
              communes=json.load(r)
          match=next((c for c in communes if c['nom'].casefold()==ville.casefold()),None)
          if match is None:
              raise SystemExit('Commune introuvable ou ambigue : '+ville)
          lon,lat=match['centre']['coordinates']
          subprocess.run([sys.executable,'radar/zoom_ville.py',
              '--dossier-grilles','radar-historique',
              '--sortie','radar-sortie/radar-zoom-ville-diagnostic.gif',
              '--ville',match['nom'],'--latitude',str(lat),'--longitude',str(lon),
              '--horodatages','radar-sortie/radar-images.json'],check=True)
          PY
      - name: Creer l'atlas anime recadrable par ville
        if: hashFiles('radar-sortie/radar-images.json') != ''
        shell: bash
        run: |
          python radar/atlas_gif.py \
            --dossier-grilles radar-historique \
            --horodatages radar-sortie/radar-images.json \
            --sortie radar-sortie/radar-atlas-diagnostic.gif \
            --manifest radar-sortie/radar-atlas.json
      - name: Preparer l'hebergement public du radar diagnostic
        if: hashFiles('radar-sortie/radar-atlas-diagnostic.gif') != ''
        shell: bash
        run: |
          mkdir -p radar-public
          cp radar-sortie/radar-atlas-diagnostic.gif radar-sortie/radar-atlas.json radar-sortie/radar-marker.png radar-public/
          touch radar-public/.nojekyll
          cat > radar-public/index.html <<'HTML'
          <!doctype html><html lang="fr"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>KFS Météo — radar expérimental</title>
          <style>body{font:16px system-ui;max-width:900px;padding:24px;margin:auto;background:#eef2f6;color:#172d40}
          img{max-width:100%;border-radius:12px}strong{color:#ad1831}</style>
          <h1>Radar KFS Météo — diagnostic</h1>
          <p><strong>GÉORÉFÉRENCEMENT NON VALIDÉ.</strong> Animation de démonstration,
          ne pas utiliser pour une décision de sécurité météorologique.</p>
          <img src="./radar-atlas-diagnostic.gif" alt="Radar de diagnostic">
          <p>Source : Météo-France DPRadar (mosaïque de réflectivité).</p>
          </html>
          HTML
      - name: Conserver l'atlas comme artefact de publication
        if: hashFiles('radar-public/radar-atlas-diagnostic.gif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: radar-atlas-publication
          path: radar-public
          retention-days: 2
      - name: Indiquer si l'atlas est publiable
        id: atlas_check
        shell: bash
        run: |
          if [ -s radar-public/radar-atlas-diagnostic.gif ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resume lisible du radar (GIF national et zoom)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          from PIL import Image
          import json,os
          root=Path('radar-sortie')
          root.mkdir(exist_ok=True)
          source=root/'radar-images.json'
          try:
              times=json.loads(source.read_text()) if source.exists() else []
          except (OSError, ValueError):
              times=[]
          # Le format des grilles est AAAA-MM-JJTHH-MM-SSZ ; les heures de la liste
          # sont AAAA-MM-JJTHH:MM:SSZ.
          def grid_name(stamp):
              dt=datetime.fromisoformat(stamp.replace('Z','+00:00'))
              return 'radar-grid-'+dt.strftime('%Y-%m-%dT%H-%M-%SZ')+'.npz'
          count_grid=sum((Path('radar-historique')/grid_name(t)).is_file() for t in times)
          national=root/'radar-diagnostic.gif'
          local=root/'radar-zoom-ville-diagnostic.gif'
          def frames(path):
              if not path.exists():
                  return 0
              with Image.open(path) as gif:
                  return gif.n_frames
          n_nat=frames(national)
          n_loc=frames(local)
          n_atlas=frames(root/'radar-atlas-diagnostic.gif')
          journal=root/'declenchements-radar.json'
          runs=json.loads(journal.read_text()) if journal.exists() else []
          n_scheduled=sum(r.get('event')=='schedule' for r in runs)
          n_manual=sum(r.get('event')=='workflow_dispatch' for r in runs)
          status={
              'generation_utc':datetime.now(timezone.utc).isoformat(),
              'mode':'DIAGNOSTIC',
              'publication_discord_autorisee':False,
              'observation_plus_recente_utc':times[-1] if times else None,
              'images_selectionnees':len(times),
              'grilles_disponibles_parmi_images':count_grid,
              'images_gif_national':n_nat,
              'images_gif_local':n_loc,
              'images_gif_atlas':n_atlas,
              'declenchements_programmes_60min':n_scheduled,
              'declenchements_manuels_60min':n_manual,
              'regularite_automatique_confirmee':n_scheduled>=6,
              'radar_national_pret':n_nat>=2,
              'radar_local_pret':n_loc>=2,
              'cause_zoom_indisponible':(
                  None if n_loc>=2 else
                  ('moins_de_deux_grilles_recentes' if count_grid<2 else
                   'echec_zoom_ou_grilles_incompatibles')),
              'georeferencement_valide':False
          }
          (root/'etat-radar.json').write_text(json.dumps(status,indent=2,ensure_ascii=False))
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          lines=[
              '## Bilan du radar — diagnostic uniquement',
              f'- Images GIF France : **{n_nat}**',
              f'- Images GIF ville : **{n_loc}**',
              f'- Images atlas recadrable : **{n_atlas}**',
              f'- Grilles radar disponibles : **{count_grid}/{len(times)}**',
              f'- Acquisitions automatiques lancees en 60 min : **{n_scheduled}** (objectif 6 minimum)',
              f'- Acquisitions manuelles lancees en 60 min : **{n_manual}**',
              f'- Derniere observation : **{times[-1] if times else "aucune"}**',
              '- Georeferencement : **NON VALIDE** (aucune diffusion Discord)',
          ]
          if n_loc<2:
              lines.append('- Zoom indisponible : au moins deux grilles recentes et compatibles sont necessaires.')
          if summary:
              with open(summary,'a',encoding='utf-8') as file:
                  file.write('\n'.join(lines)+'\n')
          print('BILAN RADAR:',json.dumps(status,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-gif-diagnostic
          path: |
            radar-sortie/radar-diagnostic.gif
            radar-sortie/radar-zoom-ville-diagnostic.gif
            radar-sortie/radar-zoom-ville-diagnostic.json
            radar-sortie/radar-atlas-diagnostic.gif
            radar-sortie/radar-atlas.json
            radar-sortie/radar-marker.png
            radar-sortie/radar-images.json
            radar-sortie/etat-radar.json
            radar-sortie/declenchements-radar.json
            radar-sortie/diagnostic-assemblage.txt
          if-no-files-found: warn

  publication-pages:
    name: Publier le radar diagnostic sur GitHub Pages
    needs: gif-diagnostic
    if: needs.gif-diagnostic.outputs.atlas_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: radar-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: radar-atlas-publication
          path: radar-public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: radar-public
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
