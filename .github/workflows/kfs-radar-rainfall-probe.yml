name: KFS quantitative radar rainfall qualification
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kfs-radar-rainfall-probe.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
    steps:
      - run: pip install -q requests eccodes numpy pandas pyproj
      - name: Qualify quantitative 5-minute rainfall product
        run: |
          python - <<'PY'
          import requests,os,gzip,io,json,tempfile
          from urllib.parse import urlparse,urljoin
          from eccodes import codes_bufr_new_from_file,codes_get,codes_get_array,codes_release
          token=os.environ.get('METEOFRANCE_API_KEY')
          assert token,'Existing radar API key unavailable'
          base='https://public-api.meteofrance.fr/public/DPRadar/v1/'
          h={'apikey':token}
          r=requests.get(base+'mosaiques/METROPOLE/observations/LAME_D_EAU',headers=h,timeout=30)
          print('RADAR CATALOG',r.status_code,flush=True);r.raise_for_status()
          d=r.json();print('METADATA KEYS',list(d),flush=True)
          for k in ['date','datetime','time','timestamp','validityTime','validityDate','observationTime','dateObservation','updated','lastUpdate']:
              if k in d:print('TIME',k,d[k],flush=True)
          links=[l for l in d.get('links',[]) if l.get('href') and (l.get('type')=='application/octet-stream+gzip' or l.get('rel','').endswith('/data'))]
          assert links,'No quantitative product'
          url=urljoin(base,links[0]['href']);assert urlparse(url).scheme=='https' and urlparse(url).hostname=='public-api.meteofrance.fr'
          with requests.get(url,headers=h,timeout=(15,90),stream=True) as r:
              print('RADAR DATA',r.status_code,r.headers.get('Content-Type'),flush=True);r.raise_for_status()
              b=bytearray()
              for chunk in r.iter_content(1024*1024):
                  b.extend(chunk);assert len(b)<25_000_000
          if b[:2]==b'\x1f\x8b':b=gzip.decompress(b)
          print('RAW',len(b),bytes(b[:4]),flush=True)
          assert b[:4]==b'BUFR'
          stream=tempfile.TemporaryFile();stream.write(b);stream.seek(0);g=codes_bufr_new_from_file(stream)
          assert g is not None
          try:
              for k in ('edition','bufrHeaderCentre','masterTablesVersionNumber','localTablesVersionNumber','typicalDate','typicalTime','numberOfSubsets','compressedData'):
                  try:print('BUFR',k,codes_get(g,k),flush=True)
                  except Exception:pass
              print('DESCRIPTORS',codes_get_array(g,'unexpandedDescriptors').tolist()[:100],flush=True)
          finally:codes_release(g);stream.close()
          from pathlib import Path
          import numpy as np,pandas as pd
          from datetime import datetime,timezone
          work=Path('rainfall-probe');work.mkdir(exist_ok=True);(work/'radar.bufr').write_bytes(b)
          tables=work/'tables';tables.mkdir(exist_ok=True)
          root='https://raw.githubusercontent.com/theperk08/Meteo_France_Radars/a89383b435b26625909a70a16f7be5b75ce54ba5/'
          for name in ['bufrtabb_16.csv','bufrtabd_16.csv','localtabb_85_14.csv','localtabd_85_14.csv']:
              r=requests.get(root+'tables/'+name,timeout=30);r.raise_for_status();(tables/name).write_bytes(r.content)
          r=requests.get(root+'MeteoFrance_Bufr_Decoder.ipynb',timeout=30);r.raise_for_status();notebook=r.json()
          ns={};exec('import os,gzip,math,numpy as np,pandas as pd',ns)
          for idx in [5,6,7,8,9,10,11]:exec(''.join(notebook['cells'][idx]['source']),ns)
          ns.update(DIR_PATH=str(work),FILE_NAME='radar.bufr',DIR_PATH_TABLE=str(tables),FIC_TAB_B='bufrtabb_{master}.csv',FIC_TAB_D='bufrtabd_{master}.csv',FIC_LOCAL_TAB_B='localtabb_{center}_{local}.csv',FIC_LOCAL_TAB_D='localtabd_{center}_{local}.csv',affiche_descriptors=False)
          # BUFR declares master table 11, not 16: use exact tables from installed ecCodes.
          # ecCodes supports WMO table 11, but needs MF local definitions separately.
          from eccodes import codes_definition_path
          print('DEFINITIONS',codes_definition_path(),flush=True)
          import csv
          for name in ['bufrtabb_16.csv','bufrtabd_16.csv','localtabb_85_14.csv','localtabd_85_14.csv']:
              print('TABLE FORMAT',name,(tables/name).read_text(encoding='utf-8-sig').splitlines()[:3],flush=True)
          for name in ['bufrtabb_11.csv','bufrtabd_11.csv']:
              r=requests.get(root+'tables/'+name,timeout=30)
              print('MASTER TABLE 11',name,r.status_code,flush=True)
              if r.ok:(tables/name).write_bytes(r.content)
          assert (tables/'bufrtabb_11.csv').exists() and (tables/'bufrtabd_11.csv').exists(),'Exact WMO master table 11 unavailable in pinned decoder'
          ns['deco_bufr']();messages=ns.get('datas_messages',[]);assert messages
          for m in messages:
              print('DECODED KEYS',[(k,len(v)) for k,v in m.items()],flush=True)
              for k,v in m.items():
                  if len(v)<150:print('META',k,str(v)[:900],flush=True)
                  elif len(v)>10000:
                      a=np.asarray(v,dtype=float);unique,counts=np.unique(a,return_counts=True);print('ARRAY',k,len(a),float(np.nanmin(a)),float(np.nanmax(a)),sorted(zip(counts.tolist(),unique.tolist()),reverse=True)[:15],flush=True)
          for file in tables.glob('*.csv'):
              for line in file.read_text(encoding='utf-8-sig').splitlines():
                  if any(x in line.lower() for x in ('precipitation','precipitations','lame d','49209','49210')) and ('49;' in line or '49,' in line or '49209' in line or '49210' in line):print('TABLE',file.name,line[:400],flush=True)
          PY
