name: KFS DIAGRAMME - ECMWF ENS direct backup
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_diagramme_ecmwf_backup.py
      - .github/workflows/kfs-diagramme-ecmwf-backup.yml
  schedule:
    # Tentatives anticipées puis rattrapage pour les runs longs 00Z / 12Z.
    # ECMWF ne fournit le run complet que lorsque tous les pas sont publiés.
    - cron: '30 9,11,21,23 * * *'
permissions:
  contents: write
concurrency:
  group: kfs-diagramme-ens-direct
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ecmwf-proba.txt
      - name: Install ecCodes and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-data
          python -m pip install -r scripts/requirements-ecmwf-proba.txt
      - name: Verify syntax
        run: python -m py_compile scripts/build_diagramme_ecmwf_backup.py
      - name: Fetch ECMWF IFS ENS real members
        env:
          ECMWF_SOURCE: ecmwf
        run: python scripts/build_diagramme_ecmwf_backup.py
      - name: Publish verified JSON
        run: |
          git config user.name 'KFS METEO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagramme/ifs-ens-8m.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'KFS: actualiser diagramme ENS depuis ECMWF direct'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
