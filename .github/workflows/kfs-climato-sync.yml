name: Activer la commande Discord KFS climato
on:
  push:
    paths:
      - .github/workflows/kfs-climato-sync.yml
      - cloudflare/kfs-climato-observations.js
      - cloudflare/kfs-climato-phenomenes.js
      - cloudflare/kfs-climato-foudre-wglc.js
      - data/wglc/*.json.gz
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Valider les archives de foudre publiees depuis GitHub
        run: |
          python - <<'PY'
          import gzip,json,urllib.request
          url="https://raw.githubusercontent.com/almet27/kfs-meteo-cartes/main/data/wglc/wglc_france_2024.json.gz"
          with urllib.request.urlopen(url,timeout=25) as res:
              obj=json.loads(gzip.decompress(res.read()))
          assert obj["year"]==2024 and len(obj["monthly"])==12
          assert len(obj["lat"])==138 and len(obj["lon"])==210
          print("WGLC_PUBLIC_REMOTE_OK 2024",len(obj["monthly"][0]))
          PY
      - name: Declencher la synchronisation Discord dans le Worker
        shell: bash
        run: |
          set -euo pipefail
          url="https://kfs-meteo-ia.alain-leprevost.workers.dev/"
          code=$(curl --max-time 30 -sSL -o /tmp/kfs-climato-response.txt -w "%{http_code}" "$url")
          echo "Worker KFS HTTP: $code"
          head -c 400 /tmp/kfs-climato-response.txt || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then
            echo "Worker non accessible ; enregistrement Discord non confirme"
            exit 1
          fi
          echo "Worker joint ; synchronisation Discord déclenchée par la requête (vérifier les journaux pour confirmation)"
          echo "Archives 2010-2025 WWLLN/WGLC et rubrique orages activées ; jours de station conservés"
