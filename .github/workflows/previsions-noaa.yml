name: Prévisions Europe GFS AIGFS
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_noaa_forecasts.py'
      - '.github/workflows/previsions-noaa.yml'
  schedule:
    - cron: '15 6,12,18,0 * * *'
permissions:
  contents: write
concurrency:
  group: previsions-noaa
  cancel-in-progress: false
jobs:
  cartes:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          pip install herbie-data cfgrib eccodes xarray numpy matplotlib cartopy
      - name: Générer GFS et AIGFS
        run: python scripts/generate_noaa_forecasts.py
      - name: Publier les cartes NOAA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-maps/europe/
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser GFS AIGFS Europe'
            git pull --rebase
            git push
          fi
