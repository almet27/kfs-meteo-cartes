name: KFS France - réparer les publications quotidiennes AIFS et AIGFS

on:
  push:
    paths:
      - .github/workflows/initialiser-france-quotidien.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  lancer:
    runs-on: ubuntu-latest
    steps:
      - name: Réessayer AIFS et publier le quotidien alternatif AIGFS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 42539015128 42539017242; do
            gh workflow run publier-france-releases.yml --repo "$GH_REPO" --ref main \
              -f source_run_id="$run"
          done
          echo "Publications AIFS/AIGFS demandées"
