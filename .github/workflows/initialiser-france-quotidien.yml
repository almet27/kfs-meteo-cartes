name: KFS France - initialiser les cartes quotidiennes

on:
  push:
    paths:
      - .github/workflows/initialiser-france-quotidien.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  lancer:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher IFS et GFS +72 h pour produire les cartes quotidiennes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for model in ifs gfs; do
            echo "Lancement KFS France +72h $model sur main"
            gh workflow run france-h72.yml --repo "$GH_REPO" --ref main \
              -f modele="$model" -f horizon=72
          done
          echo "Les autres modèles suivent le détecteur régulier de nouveaux runs."
