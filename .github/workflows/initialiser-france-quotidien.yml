name: KFS France - regenerer les cartes avec labels RUN 00Z/06Z/12Z/18Z

on:
  push:
    paths:
      - .github/workflows/initialiser-france-quotidien.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  lancer:
    runs-on: ubuntu-latest
    steps:
      - name: Actualiser les visuels France pour tous les modeles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for model in gfs ifs aifs-single aigfs; do
            echo "Demander les nouvelles cartes annotées avec RUN pour $model"
            gh workflow run france-h72.yml --repo "$GH_REPO" --ref main \
              -f modele="$model" -f horizon=72
          done
          echo "Les cartographies Europe restent inchangées."
