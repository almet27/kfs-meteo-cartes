name: KFS France - publier le quotidien alternatif AIGFS

on:
  push:
    paths:
      - .github/workflows/initialiser-france-quotidien.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  lancer:
    runs-on: ubuntu-latest
    steps:
      - name: Publier AIGFS du cycle antérieur sans écraser les cartes horaires
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run publier-france-releases.yml --repo "$GH_REPO" --ref main \
            -f source_run_id=42539017242
          echo "Publication quotidienne AIGFS demandée"
