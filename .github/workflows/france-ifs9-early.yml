name: KFS France - ECMWF IFS 9 km anticipe (Open-Meteo)
on:
  workflow_dispatch:
    inputs:
      run_utc:
        description: 'Run explicite (YYYY-MM-DDT12:00Z), vide = dernier 12Z'
        required: false
        type: string
  push:
    paths:
      - 'scripts/ifs_early9km.py'
      - '.github/workflows/france-ifs9-early.yml'
  schedule:
    - cron: '2,17,32,47 17-21 * * *'
permissions:
  contents: write
concurrency:
  group: kfs-ifs9-early-france
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Eviter une regeneration si le run est deja publie
        id: gate
        env:
          RUN_INPUT: ${{ github.event.inputs.run_utc }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          if os.getenv('RUN_INPUT'):
              cycle=datetime.fromisoformat(os.environ['RUN_INPUT'].replace('Z','+00:00'))
              if cycle.tzinfo is None: cycle=cycle.replace(tzinfo=timezone.utc)
          else:
              cycle=now.replace(hour=12,minute=0,second=0,microsecond=0)
              if now.hour<16: cycle-=timedelta(days=1)
          p=Path('forecast-maps/france/ifs-early9km/latest.json')
          done=False
          if p.exists():
              try:done=json.loads(p.read_text()).get('run_utc')==cycle.isoformat()
              except Exception:pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('skip='+('true' if done else 'false')+'\n')
          print('Run visé:',cycle.isoformat(),'déjà publié:',done)
          PY
      - name: Installer bibliothèques cartographiques
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.8' 'cartopy>=0.23' 'Pillow>=10,<13'
      - name: Verifier le code
        if: steps.gate.outputs.skip != 'true'
        run: python -m py_compile scripts/ifs_early9km.py scripts/generate_france_shortterm_risks.py scripts/kfs_weather_symbols.py
      - name: Detecter le run exact et dessiner les premieres cartes
        if: steps.gate.outputs.skip != 'true'
        env:
          RUN_INPUT: ${{ github.event.inputs.run_utc }}
        run: |
          if [ -n "$RUN_INPUT" ]; then
            python scripts/ifs_early9km.py --run-utc "$RUN_INPUT"
          else
            python scripts/ifs_early9km.py
          fi
      - name: Publier cartes et catalogue ensemble sans écraser les cartes officielles
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ ! -f forecast-maps/france/ifs-early9km/latest.json ]; then
            echo 'Run ECMWF anticipé pas encore prêt : conserver les cartes officielles'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-maps/france/ifs-early9km/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualiser cartes ECMWF IFS HRES 9 km anticipees'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Conflit : ne pas ecraser les autres cartes'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
