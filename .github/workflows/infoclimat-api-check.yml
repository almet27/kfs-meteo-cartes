name: Diagnostic clé Infoclimat
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/infoclimat-api-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tester la présence et la validité de la clé sans l'afficher
        env:
          INFOCLIMAT_API_KEY: ${{ secrets.INFOCLIMAT_API_KEY }}
        run: |
          python - <<'PY'
          import os, datetime as dt, json, urllib.request, urllib.parse, urllib.error
          token=os.environ.get("INFOCLIMAT_API_KEY","").strip()
          if not token:
              print("SECRET_ABSENT : INFOCLIMAT_API_KEY")
              raise SystemExit(1)
          print("SECRET_PRESENT")
          today=dt.datetime.now(dt.timezone.utc).date()
          q=urllib.parse.urlencode({"method":"get","format":"json","stations[]":"STATIC0253","start":str(today-dt.timedelta(days=1)),"end":str(today),"token":token})
          req=urllib.request.Request("https://www.infoclimat.fr/opendata/?"+q,headers={"Accept":"application/json","User-Agent":"KFS-METEO/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  print("HTTP",r.status)
                  d=json.load(r)
              if isinstance(d,dict):
                  print("Structure",list(d.keys())[:20])
                  for k in ("status","error","message"):
                      if k in d:
                          msg=str(d[k]).lower()
                          print(k,"IP refusée" if "ip" in msg else "erreur API" if k=="error" else "présent")
                  if d.get("error"): raise SystemExit(1)
                  print("Données disponibles",bool(d.get("STATIC0253") or d.get("data") or d.get("stations")))
              elif isinstance(d,list):
                  print("Nombre de lignes",len(d))
              else:
                  print("Format inattendu")
          except urllib.error.HTTPError as e:
              print("HTTP",e.code)
              raise SystemExit(1)
          except Exception as e:
              print("Diagnostic impossible",type(e).__name__)
              raise SystemExit(1)
          PY
