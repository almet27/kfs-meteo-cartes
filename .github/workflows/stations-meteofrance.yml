name: KFS Meteo - Cartes des stations Météo-France

on:
  workflow_dispatch:
  schedule:
    - cron: "25,55 * * * *"
  push:
    branches:
      - main
      - feature/cartes-stations-meteofrance-20261108
    paths:
      - scripts/generate_station_maps.py
      - scripts/check_station_api.py
      - .github/workflows/stations-meteofrance.yml

permissions:
  contents: write

concurrency:
  group: cartes-stations-meteofrance
  cancel-in-progress: false

jobs:
  cartes-stations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drawing libraries
        run: python -m pip install --disable-pip-version-check "matplotlib>=3.9,<4" "Pillow>=11,<13" "scipy>=1.14,<2"
      - name: Validate conversions and aggregations
        run: python scripts/generate_station_maps.py --self-test
      - name: Diagnose Météo-France API subscriptions (status codes only)
        env:
          METEOFRANCE_BASIC_AUTH: ${{ secrets.METEOFRANCE_BASIC_AUTH }}
        run: python scripts/check_station_api.py
      - name: Generate maps from real stations
        env:
          METEOFRANCE_BASIC_AUTH: ${{ secrets.METEOFRANCE_BASIC_AUTH }}
        run: python scripts/generate_station_maps.py
      - name: Validate the map output
        run: |
          test -s station-maps/manifest.json
          test -s station-maps/fr-temperature.png
          test -s station-maps/r14-temperature.png
          test "$(find station-maps -type f -name '*.png' | wc -l)" -eq 147
      - name: Archive proof for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cartes-stations-meteofrance
          path: station-maps/
          retention-days: 3
      - name: Publish public images without adding binaries to Git history
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view stations-live >/dev/null 2>&1; then
            gh release create stations-live \
              --title "Cartes des stations KFS Météo" \
              --notes "Observations des stations. Source : Météo-France ; contours : IGN / Admin Express." \
              --prerelease
          fi
          gh release upload stations-live station-maps/*.png station-maps/manifest.json --clobber

# Relance ponctuelle demandée le 2026-11-08 pour publier les dégradés de température.
