name: KFS France - initialisation 4 modeles sur nouvelles cartes
on:
  push:
    paths:
      - .github/workflows/kfs-france-bootstrap.yml
permissions:
  actions: write
  contents: read
jobs:
  initialisation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Actualiser GFS France avec normalisation des cumuls 3 h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recompilation du GFS apres verification des cumuls APCP 3 h.
          gh workflow run france-h72.yml --ref main -f modele=gfs -f horizon=72
