name: Verifier tables BUFR radar

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Controler les descripteurs Meteo-France
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,io,urllib.request
          root='https://raw.githubusercontent.com/theperk08/Meteo_France_Radars/main/tables/'
          def table(name):
              with urllib.request.urlopen(root+name,timeout=30) as r:
                  return list(csv.reader(io.StringIO(r.read().decode('utf-8-sig')),delimiter=';'))
          b=table('localtabb_85_14.csv')
          d=table('localtabd_85_14.csv')
          for desc in ('001192','029192','025194','025192','006196','025210','048192','031192'):
              f,x,y=int(desc[0]),int(desc[1:3]),int(desc[3:])
              rows=b if f==0 else d if f==3 else []
              hits=[]
              for row in rows:
                  try:
                      a,bx,by=(int(row[i].strip()) for i in range(3))
                      if (a,bx,by)==(f,x,y):hits.append(row)
                  except (ValueError,IndexError):pass
              print(desc,'=>',hits[:1] if hits else 'non trouve dans B/D (possiblement operateur ou replication)')
          print('Tables verifiees. Aucun changement aux workflows existants.')
          PY
