name: AROME ICON - Precipitations horaires par phase
on:
  workflow_dispatch:
  schedule:
    - cron: '38 */3 * * *'
  push:
    branches: [main]
    paths: ['scripts/generate_hourly_precip_phase.py', '.github/workflows/hourly-precip-phase.yml']
permissions:
  contents: write
concurrency:
  group: hourly-precip-phase
  cancel-in-progress: false
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        model: [arome, icon]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pillow eccodes
      - run: gh release download "$MODEL-phase" --pattern manifest.json --output "previous-$MODEL-phase.json" || true
      - name: Validate archive geometry and previous archive availability
        run: |
          python scripts/kfs_precip_archive.py
          if [ -f "previous-$MODEL-phase.json" ]; then
            name=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("numeric_archive",""))' "previous-$MODEL-phase.json")
            if [ -n "$name" ] && ! gh release view "$MODEL-precip-archive" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              python -c 'import json,sys;p=sys.argv[1];d=json.load(open(p));d.pop("numeric_archive",None);open(p,"w").write(json.dumps(d))' "previous-$MODEL-phase.json"
            fi
          fi
      - run: python scripts/generate_hourly_precip_phase.py "$MODEL"
      - name: Publish coherent phase maps
        run: |
          if [ ! -s "$MODEL-phase/manifest.json" ]; then exit 0; fi
          if ! gh release view "$MODEL-phase" >/dev/null 2>&1; then
            gh release create "$MODEL-phase" --title "$MODEL - Precipitations horaires" --notes "Source : Meteo-France AROME SP2 ou DWD ICON-D2. Phases dominantes, mm equivalent eau." --prerelease
          fi
          gh release upload "$MODEL-phase" "$MODEL-phase"/*.png --clobber
          gh release upload "$MODEL-phase" "$MODEL-phase/manifest.json" --clobber
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          model=os.environ["MODEL"]
          tag=model+"-phase"
          keep={p.name for p in Path(tag).glob("*.png")}
          prev=Path("previous-"+tag+".json")
          if prev.exists():keep.update(f["file"] for f in json.loads(prev.read_text()).get("frames",[]))
          assets=json.loads(subprocess.check_output(["gh","release","view",tag,"--json","assets"]))["assets"]
          for a in assets:
              name=a["name"]
              if name.startswith("phase-") and name not in keep:
                  subprocess.run(["gh","release","delete-asset",tag,name,"--yes"],check=False)
          PY

      - name: Preserve numerical forecasts for seven days
        run: |
          shopt -s nullglob
          files=("$MODEL-phase"/verify-*.npz)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          tag="$MODEL-precip-archive"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "KFS quantitative precipitation archive - $MODEL" --notes "Prospective rainfall verification, common 0.04 degree grid. Actual availability is asset creation time. Seven-day rolling retention." --prerelease
          gh release upload "$tag" "${files[@]}"
          python - "$tag" <<'PY'
          import json,subprocess,sys
          from datetime import datetime,timezone,timedelta
          tag=sys.argv[1];cut=datetime.now(timezone.utc)-timedelta(days=7)
          assets=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','assets']))['assets']
          for a in assets:
              t=datetime.fromisoformat(a['createdAt'].replace('Z','+00:00'))
              if a['name'].startswith('verify-') and t<cut:
                  subprocess.run(['gh','release','delete-asset',tag,a['name'],'--yes'],check=False)
          PY
