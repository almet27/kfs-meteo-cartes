name: KFS test archives EUMETSAT par station
on:
  push:
    paths:
      - .github/workflows/eumetsat-li-station-archive.yml
  workflow_dispatch:
    inputs:
      date:
        description: 'Date historique (YYYY-MM-DD)'
        required: true
        default: '2025-07-12'
      full_day:
        description: 'Journée entière (LUT officielle requise)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: eumetsat-li-station-archive
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r foudre-li/requirements.txt scipy
      - name: Tester accès historique et géolocalisation
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          TEST_DATE: ${{ inputs.date || '2025-07-12' }}
          FULL_DAY: ${{ inputs.full_day || 'false' }}
        run: |
          python -m py_compile foudre-li/archive_station.py
          if [ "$FULL_DAY" = true ]; then
            python foudre-li/archive_station.py --date "$TEST_DATE"
          else
            python foudre-li/archive_station.py --date "$TEST_DATE" --pilot
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: station-archive-report
          path: data/eumetsat-li/
      - name: Publier uniquement les journées corrigées et validées
        if: inputs.full_day == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/eumetsat-li/daily/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated EUMETSAT LFL station day'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
