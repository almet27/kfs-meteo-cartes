name: KFS essai accès archives quotidiennes de foudre MTG
on:
  push:
    paths:
      - .github/workflows/kfs-test-mtg-foudre-archive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tester trois points d'accès officiels sans clé, sans télécharger de données volumineuses
        run: |
          python - <<'PY'
          import urllib.request,urllib.error
          urls={
            'CATALOGUE':'https://api.eumetsat.int/data/browse/collections/EO%3AEUM%3ADAT%3A0691?format=json',
            'DATE_2024_11_21':'https://api.eumetsat.int/data/browse/collections/EO%3AEUM%3ADAT%3A0691/dates/2024/11/21?format=json',
            'ARCHIVE_PRODUIT':'https://api.eumetsat.int/data/download/1.0.0/collections/EO%3AEUM%3ADAT%3A0691/dates/2024/11/21/times/18/00'
          }
          for label,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'KFS-METEO-ArchiveProbe/1.0','Range':'bytes=0-300','Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                content=r.read(301)
                print(label,'HTTP',r.status,'ctype',r.headers.get('content-type'),'size',r.headers.get('content-length'),'head',repr(content[:250]),flush=True)
            except urllib.error.HTTPError as e:
              print(label,'HTTP',e.code,'ctype',e.headers.get('content-type'),'head',repr(e.read(240)),flush=True)
            except Exception as e:
              print(label,'ERROR',str(e)[:220],flush=True)
          PY