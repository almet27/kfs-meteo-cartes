name: KFS essai accès archives quotidiennes de foudre MTG
on:
  push:
    paths:
      - .github/workflows/kfs-test-mtg-foudre-archive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tester trois points d'accès officiels sans clé, sans télécharger de données volumineuses
        run: |
          python - <<'PY'
          import urllib.request,urllib.error
          urls={
            'CATALOGUE':'https://api.eumetsat.int/data/browse/collections/EO%3AEUM%3ADAT%3A0691?format=json',
            'DATE_2024_11_21':'https://api.eumetsat.int/data/browse/collections/EO%3AEUM%3ADAT%3A0691/dates/2024/11/21?format=json',
            'ARCHIVE_PRODUIT':'https://api.eumetsat.int/data/download/1.0.0/collections/EO%3AEUM%3ADAT%3A0691/dates/2024/11/21/times/18/00'
          }
          for label,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'KFS-METEO-ArchiveProbe/1.0','Range':'bytes=0-300','Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                content=r.read(301)
                print(label,'HTTP',r.status,'ctype',r.headers.get('content-type'),'size',r.headers.get('content-length'),'head',repr(content[:250]),flush=True)
            except urllib.error.HTTPError as e:
              print(label,'HTTP',e.code,'ctype',e.headers.get('content-type'),'head',repr(e.read(240)),flush=True)
            except Exception as e:
              print(label,'ERROR',str(e)[:220],flush=True)
          PY
      - name: Examiner l'arborescence officielle de produits disponibles
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          base='https://api.eumetsat.int/data/browse/1.0.0/collections/EO%3AEUM%3ADAT%3A0691'
          endpoints=['/dates','/dates/2024','/dates/2025','/dates/2025/07','/dates/2025/07/12','/dates/2026/11/09']
          for p in endpoints:
            try:
              with urllib.request.urlopen(urllib.request.Request(base+p+'?format=json',headers={'User-Agent':'KFS-METEO-Probe/1.0'}),timeout=15) as r:
                d=json.loads(r.read(500000))
              keys=list(d)
              print('BROWSE',p,'200','keys',keys,'counts',{k:v for k,v in d.items() if 'number' in k.lower() or 'count' in k.lower()},'head',str(d)[:350],flush=True)
            except urllib.error.HTTPError as e: print('BROWSE',p,'HTTP',e.code,flush=True)
            except Exception as e: print('BROWSE',p,'ERROR',repr(e)[:160],flush=True)
          PY
