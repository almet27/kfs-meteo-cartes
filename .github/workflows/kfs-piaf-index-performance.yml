name: KFS PIAF lightweight index performance
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kfs-piaf-index-performance.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Measure real PIAF index and first displayed precipitation frame
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright-core');
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});try{
            const p=await b.newPage({...devices['iPhone 13'],serviceWorkers:'block'}),errors=[],req=[];
            p.on('pageerror',e=>errors.push(e.message));p.on('response',r=>{if(r.url().includes('/api/piaf/'))req.push([r.status(),r.url().split('/api/piaf/')[1]])});
            await p.goto('https://kfs-meteo.fr/#accueil',{waitUntil:'domcontentloaded',timeout:60000});
            const info=await p.evaluate(async()=>{const t=performance.now(),r=await fetch('/api/piaf/index.json'),raw=await r.text(),ms=Math.round(performance.now()-t);if(!r.ok)throw Error('Index HTTP '+r.status+' '+raw.slice(0,100));const d=JSON.parse(raw);if(raw.length>15000||!d.frames.length||d.frames.some(f=>f.png))throw Error('Heavy index');const f=d.frames[0],start=performance.now(),a=await fetch('/api/piaf/cached/'+f.file);if(!a.ok)throw Error('PNG HTTP '+a.status);const blob=await a.blob(),img=await createImageBitmap(blob);const size=[img.width,img.height];img.close();return {indexBytes:raw.length,indexMs:ms,render:d.render,frames:d.frames.length,pngBytes:blob.size,pngMs:Math.round(performance.now()-start),size,run:d.run_utc}});
            console.log('PERFORMANCE',JSON.stringify(info));if(info.size.join(',')!=='730,735')throw Error('Projection');
            await p.evaluate(()=>{const h=document.getElementById('home-live');if(h?.hidden)h.hidden=false;const v=document.getElementById('obs-stations-view');v?.scrollIntoView();document.getElementById('obs-layer').value='temp';document.getElementById('obs-hour-model').value='blend';document.getElementById('obs-rain-overlay-toggle').checked=true;document.getElementById('obs-snow-only-toggle').checked=false;document.getElementById('kfs-piaf-auto').checked=true;const hour=document.getElementById('obs-hour');hour.value='1';hour.dispatchEvent(new Event('input',{bubbles:true}));hour.dispatchEvent(new Event('change',{bubbles:true}));});
            const t=Date.now();try{await p.waitForFunction(()=>!!window.kfsPiafActiveTime&&!!document.querySelector('[data-kfs-piaf-active="1"] .kfs-piaf-overlay'),null,{timeout:20000});console.log('FIRST DISPLAY',Date.now()-t,'ms',await p.evaluate(()=>({time:window.kfsPiafActiveTime,fast:document.getElementById('obs-stations-view').dataset.kfsPiafFast,badge:document.getElementById('kfs-piaf-source-badge').textContent})));}catch(e){console.log('DISPLAY INCONCLUSIVE',await p.evaluate(()=>({note:document.getElementById('kfs-piaf-note').textContent,hour:document.getElementById('obs-hour').value,model:document.getElementById('obs-hour-model').value})));throw e;}
            console.log('REQUESTS',JSON.stringify(req),'ERRORS',JSON.stringify(errors));if(errors.length)throw Error('Browser errors');
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
