name: Publier radar RainViewer pour Discord

on:
  schedule:
    # Vérification toutes les 5 minutes, décalée de :00 pour éviter
    # les périodes de forte charge des planificateurs GitHub Actions.
    # RainViewer peut fournir des observations plus espacées (souvent 10 min).
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'rainviewer/*.py'
      - '.github/workflows/rainviewer-discord.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rainviewer-github-pages
  cancel-in-progress: false

jobs:
  radar-rainviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la présence d'une nouvelle image radar
        id: nouveaute
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          def read_json(url, timeout=15):
              request = urllib.request.Request(
                  url, headers={"User-Agent":"KFS-Meteo-RainViewer-GitHub/1.0",
                                "Cache-Control":"no-cache"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          build = True
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              try:
                  latest = read_json("https://api.rainviewer.com/public/weather-maps.json")
                  frames = latest.get("radar", {}).get("past", [])
                  latest_stamp = max(int(x["time"]) for x in frames)
                  published = read_json(
                      "https://almet27.github.io/kfs-meteo-cartes/rainviewer/"
                      "radar-rainviewer.json?check=" +
                      str(int(dt.datetime.now(dt.timezone.utc).timestamp())))
                  pub_stamp = dt.datetime.fromisoformat(
                      published["derniere_observation_utc"]).timestamp()
                  build = latest_stamp > pub_stamp
                  print("Dernier radar RainViewer :", latest_stamp)
                  print("Dernier radar déjà publié :", pub_stamp)
              except Exception as exc:
                  print("Comparaison impossible, publication de secours :", str(exc)[:160])
                  build = True
          if not build:
              print("Pas de nouvelle image radar : inutile de générer le même GIF.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("build=" + ("true" if build else "false") + "\n")
          PY
      - name: Installer Pillow pour assembler le GIF
        if: steps.nouveaute.outputs.build == 'true'
        run: python -m pip install --disable-pip-version-check pillow
      - name: Tests de localisation et assemblage sans reseau
        if: steps.nouveaute.outputs.build == 'true'
        run: |
          python -m py_compile rainviewer/build_atlas.py
          python -m unittest discover -s rainviewer -p 'test_*.py' -v
      - name: Construire la derniere animation RainViewer
        if: steps.nouveaute.outputs.build == 'true'
        run: |
          python rainviewer/build_atlas.py --output radar-public/rainviewer
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('radar-public/rainviewer')
          m=json.loads((root/'radar-rainviewer.json').read_text())
          with Image.open(root/'radar-rainviewer.gif') as gif:
              assert gif.n_frames >= 2, 'Animation avec moins de 2 images'
              assert gif.size == (1536,1536), 'Emprise radar invalide'
              print('ANIMATION RADAR VERIFIEE:',gif.n_frames,'images',
                    m['derniere_observation_utc'])
          PY
      - name: Index public avec attribution RainViewer
        if: steps.nouveaute.outputs.build == 'true'
        run: |
          cat > radar-public/index.html <<'HTML'
          <!doctype html><html lang="fr"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>KFS Météo — Radar RainViewer</title>
          <style>body{font:16px system-ui;max-width:900px;padding:24px;margin:auto;background:#eef3f8;color:#172d40}
          img{max-width:100%;border-radius:10px}</style>
          <h1>Radar RainViewer · KFS Météo</h1>
          <p>Animation des dernières observations radar, géolocalisées en Web Mercator.</p>
          <img src="./rainviewer/radar-rainviewer.gif" alt="Radar animé France">
          <p>Données : <a href="https://www.rainviewer.com/">RainViewer</a>.
          Carte : contours France GeoJSON. Pour une consultation interactive,
          utiliser Windy.</p></html>
          HTML
      - if: steps.nouveaute.outputs.build == 'true'
        uses: actions/configure-pages@v5
      - if: steps.nouveaute.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: radar-public
      - name: Publier sur GitHub Pages
        if: steps.nouveaute.outputs.build == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Resume
        if: steps.nouveaute.outputs.build == 'true'
        run: |
          echo '## Radar RainViewer publié' >> "$GITHUB_STEP_SUMMARY"
          cat radar-public/rainviewer/radar-rainviewer.json >> "$GITHUB_STEP_SUMMARY"
