name: KFS - publication immédiate des cartes premium dans Discord
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kfs-premium-release-once.yml'
permissions:
  contents: read
jobs:
  diffusion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diffuser les quatre cartes vérifiées dans le salon KFS
        run: |
          curl --fail-with-body --show-error --silent --retry 2 --retry-delay 5 \
            --max-time 90 \
            -X POST "https://kfs-meteo-ia.alain-leprevost.workers.dev/__kfs-premium-release" \
            -H "Content-Type: application/json" \
            --data '{"edition":"KFS-PREMIUM-20261109-V5"}'
