name: KFS - cartes synoptiques pour chaque periode Discord
# Actualisation finale des trois infographies après validation du run GFS et des diagnostics IFS/AIFS.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * 0' # dimanche 17:30 UTC : cartes prêtes avant la rédaction de 20h20 Europe/Paris
  push:
    paths:
      - 'scripts/generate_tendance_cards.py'
      - 'forecast-maps/tendance/tendance-analyse-donnees.json'
      - 'forecast-maps/europe/metadata.json'
      - '.github/workflows/tendance-cards.yml'
permissions:
  contents: write
concurrency:
  group: kfs-tendance-cards
  cancel-in-progress: false
jobs:
  cartes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generer des cartes de modeles synchronisees
        run: python scripts/generate_tendance_cards.py
      - name: Archiver les trois cartes et leurs sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kfs-tendance-cartes
          path: |
            forecast-maps/tendance/tendance-carte-j3.png
            forecast-maps/tendance/tendance-carte-j7.png
            forecast-maps/tendance/tendance-carte-j10.png
            forecast-maps/tendance/tendance-cartes.json
          if-no-files-found: error
      - name: Enregistrer les cartes dans le depot pour Discord
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast-maps/tendance/tendance-carte-j3.png forecast-maps/tendance/tendance-carte-j7.png forecast-maps/tendance/tendance-carte-j10.png forecast-maps/tendance/tendance-cartes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser les trois cartes /tendance avec donnees IFS AIFS'
            for attempt in 1 2 3 4 5; do
              git pull --rebase
              if git push; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
